name: LbrExampleAddon
version: '${version}'
main: com.lunarboreal.example.addon.ExampleAddonPlugin
api-version: '26.2'
description: LunarCore 扩展示例（命令 / 服务 / 变量 / Web 面板 / 自定义页面 / WebSocket 推送）
authors: [琉月·冰澜]
# 硬依赖 LunarCore：保证本插件在 LunarCore 之后加载，且能访问其 API 类
depend: [LunarCore]

# 命令不需要写在这里：通过 LunarCore 的 CommandRegistry 动态注册。
# 权限节点建议写在 plugin.yml，Bukkit 会按 default 分配（未声明的节点默认仅 OP 拥有）。
permissions:
  lbr.example.use:
    description: 使用 /lcexample 基础功能
    default: true
  lbr.example.admin:
    description: 管理示例插件
    default: op
