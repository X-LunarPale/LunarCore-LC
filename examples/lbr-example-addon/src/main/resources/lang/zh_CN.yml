# 外部插件语言包：通过 api.messages().registerBundle("example", classLoader) 注册，
# 引用 key 为 "example.<路径>"；core 会释放到 plugins/LunarCore/lang/zh_CN/example.yml 供服主修改。
usage: "<prefix><gray>用法：<yellow>/lcexample <hello|click|top>"
hello: "<prefix><aqua>你好，<white>{player}</white>！这条消息来自外部插件 <gold>LbrExampleAddon</gold>。"
click: "<prefix><green>点击成功！你的点数：<gold>{points}</gold>"
cooldown: "<prefix><red>点得太快了，请 {seconds} 秒后再试。"
announce: "<prefix><light_purple><white>{player}</white> 的点数达到了 <gold>{points}</gold>！"
top-header: "<gold>===== 点击排行 ====="
top-entry: "<gray>#{rank} <white>{player}</white> - <gold>{points}"
web-message: "<prefix><yellow>[Web 广播] <white>{message}"
