# 經濟模組語言檔案（MiniMessage 格式），引用 key：economy.<路徑>
prefix: "<gold>[<bold>經濟</bold>]</gold> "
usage:
  money: "<prefix><white>用法：<yellow>/money [玩家]</yellow> 或 <yellow>/money log [玩家] [頁]"
  pay: "<prefix><white>用法：<yellow>/pay <玩家> <金額></yellow>，大額轉帳需 <yellow>/pay confirm</yellow> 確認"
  eco: "<prefix><white>用法：<yellow>/eco <give|take|set|reset> <玩家|*> [金額]"

balance:
  self: "<prefix><white>你的餘額：<gold>{amount}"
  other: "<prefix><white>玩家 <white>{player}</white> 的餘額：<gold>{amount}"

pay:
  min: "<prefix><red>單筆轉帳金額不能低於 <gold>{min}</gold>。"
  self: "<prefix><red>不能給自己轉帳。"
  confirm: "<prefix><yellow>你將向 <white>{player}</white> 轉帳 <gold>{amount}</gold>（手續費 <gold>{fee}</gold>，合計 <gold>{total}</gold>）。<br><prefix><yellow>請在 {seconds} 秒內輸入 <click:run_command:'/pay confirm'><green><u>/pay confirm</u></green></click> 確認。"
  no-pending: "<prefix><yellow>目前沒有待確認的轉帳。"
  expired: "<prefix><yellow>轉帳確認已過期，本次未扣款，請重新發起。"
  sent: "<prefix><green>已向 <white>{player}</white> 轉帳 <gold>{amount}</gold>，目前餘額 <gold>{balance}</gold>。"
  sent-fee: "<prefix><green>已向 <white>{player}</white> 轉帳 <gold>{amount}</gold>（手續費 <gold>{fee}</gold>），目前餘額 <gold>{balance}</gold>。"
  received: "<prefix><green>你收到了 <white>{player}</white> 的轉帳 <gold>{amount}</gold>。"

baltop:
  header: "<gold>===== 財富排行榜 <white>({page}/{pages})</white> 全服總額 <yellow>{total}</yellow> ====="
  entry: "<white>#{rank} <white>{player}</white> <aqua>-</aqua> <gold>{amount}"
  self: "<white>你的排名：<yellow>#{rank}"
  empty: "<white>暫時沒有資料。"

eco:
  give: "<prefix><green>已給予 <white>{player}</white> <gold>{amount}</gold>，餘額 <gold>{balance}</gold>。"
  take: "<prefix><green>已扣除 <white>{player}</white> <gold>{amount}</gold>，餘額 <gold>{balance}</gold>。"
  set: "<prefix><green>已將 <white>{player}</white> 的餘額設定為 <gold>{balance}</gold>。"
  reset: "<prefix><green>已將 <white>{player}</white> 的餘額重置為 <gold>{balance}</gold>。"
  batch: "<prefix><green>批量操作完成：成功 {count}/{total}。"
  notify: "<prefix><white>你的餘額已被管理員調整，目前餘額：<gold>{amount}"

log:
  header: "<gold>===== <white>{player}</white> 的流水 <white>({page}/{pages})</white> ====="
  entry-in: "<green>[{time}]</green> <green>+{change}</green> <white>餘額 {balance}</white> <white>{reason}</white> <aqua>操作人 {operator}"
  entry-out: "<red>[{time}]</red> <red>-{change}</red> <white>餘額 {balance}</white> <white>{reason}</white> <aqua>操作人 {operator}"
  empty: "<white>暫時沒有流水記錄。"

error:
  no-permission: "<prefix><red>你沒有權限這樣做。"
  player-not-found: "<prefix><red>找不到玩家 <white>{player}</white> 或其沒有經濟帳戶。"
  invalid-amount: "<prefix><red>金額無效：<white>{input}</white>"
  database: "<prefix><red>資料庫查詢失敗，請稍後再試。"
  # 以下為 EconomyService 錯誤碼
  invalid_amount: "<prefix><red>金額無效。"
  insufficient_funds: "<prefix><red>餘額不足（需要 <gold>{need}</gold>，目前 <gold>{balance}</gold>）。"
  max_balance: "<prefix><red>超過帳戶最大余額上限。"
  no_account: "<prefix><red>帳戶不存在。"
  same_account: "<prefix><red>不能給自己轉帳。"
  loading: "<prefix><yellow>經濟資料載入中，請稍後再試。"
