usage: "<prefix><red>Usage: <white>{usage}"
player-not-found: "<prefix><red>Player <white>{player}</white> not found"
only-player: "<prefix><red>Players only"
reloaded: "<prefix><green>Chat module reloaded"
filter:
  cooldown: "<prefix><red>You are chatting too fast"
  duplicate: "<prefix><red>Please do not repeat the same message"
  advertising: "<prefix><red>Advertising / links are not allowed"
  global-muted: "<prefix><red>Chat is globally muted"
  muted: "<prefix><red>You are muted"
chatmute:
  on: "<prefix><red>{actor} muted the chat"
  off: "<prefix><green>{actor} unmuted the chat"
msg:
  self: "<prefix><red>You cannot message yourself"
  disabled: "<prefix><red>{player} has private messages disabled"
  ignored: "<prefix><red>{player} is ignoring you"
  no-reply: "<prefix><red>Nobody to reply to"
  toggle-on: "<prefix><green>Private messages enabled"
  toggle-off: "<prefix><yellow>Private messages disabled"
socialspy:
  on: "<prefix><green>SocialSpy enabled"
  off: "<prefix><yellow>SocialSpy disabled"
ignore:
  added: "<prefix><yellow>Ignoring <white>{player}"
  removed: "<prefix><green>No longer ignoring <white>{player}"
  self: "<prefix><red>You cannot ignore yourself"
  exempt: "<prefix><red>You cannot ignore this player"
  list: "<prefix><white>Ignored: <white>{list}"
  none: "<prefix><white>You are not ignoring anyone"
mail:
  sent: "<prefix><green>Mail sent to <white>{player}"
  sent-all: "<prefix><green>Mail sent to <white>{count}</white> players"
  header: "<prefix><gold>Your mail ({count}):"
  entry: "<white>[{time}] <aqua>{sender}</aqua>: <white>{message}"
  empty: "<prefix><white>No mail"
  cleared: "<prefix><green>Mail cleared"
  unread: "<prefix><yellow>You have <white>{count}</white> unread mail. <click:run_command:'/mail read'><aqua>[Read]</aqua></click>"
  help: "<prefix><white>/mail read | send <player> <text> | sendall <text> | clear"
nick:
  set: "<prefix><green>Nickname set to <white>{nick}"
  set-other: "<prefix><green>Set {player}'s nickname to <white>{nick}"
  reset: "<prefix><green>Nickname reset"
  too-long: "<prefix><red>Nickname length must be {min}-{max}"
  taken: "<prefix><red>That nickname is taken"
  realname: "<prefix><white>{nick} <aqua>→</aqua> <white>{player}"
  realname-none: "<prefix><red>No player uses that nickname"
staffchat:
  on: "<prefix><green>Staff chat enabled"
  off: "<prefix><yellow>Staff chat disabled"
helpop:
  sent: "<prefix><green>Your request has been sent to online staff"
clearchat:
  done: "<prefix><white>Chat cleared by <white>{actor}"
me: "<white>* <white>{player}</white> {message}"
