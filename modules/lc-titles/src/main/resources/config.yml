# Definitions are a list so removing an example does not restore it on reload.
# permission is an additional requirement to wear an owned title; blank = none.
# Displays allow colors/decorations/gradient/rainbow, never click/hover commands.
titles:
  - id: pioneer
    display: '<gold>[先驱]</gold>'
    permission: ''
  - id: supporter
    display: '<aqua>[赞助者]</aqua>'
    permission: 'lc.titles.supporter'
