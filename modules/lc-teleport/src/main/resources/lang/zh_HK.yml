# 傳送模組語言檔案（MiniMessage 格式，<prefix> 為統一前綴，{name} 為佔位符）
prefix: "<green>[<bold>傳送</bold>]</green> "
# 指令用法中，(參數) 為必填，[參數] 為選填。

common:
  player-not-found: "<prefix><red>找不到在線上的玩家 <yellow>{player}</yellow>。"
  player-unknown: "<prefix><red>從未見過玩家 <yellow>{player}</yellow>。"
  player-only: "<prefix><red>該指令只能由玩家執行。"
  no-permission: "<prefix><red>你沒有權限這樣做。"
  bad-coords: "<prefix><red>座標格式錯誤，可使用數字或 ~ 相對座標。"
  world-not-found: "<prefix><red>世界 <yellow>{world}</yellow> 不存在或未載入。"
  error: "<prefix><red>讀取資料時出錯，請稍後再試。"

usage:
  tpa: "<prefix><white>用法：<gold>/tpa (玩家)"
  tpahere: "<prefix><white>用法：<gold>/tpahere (玩家)"
  tp: "<prefix><white>用法：<gold>/tp (玩家) | /tp (玩家) (玩家) | /tp (x) (y) (z) | /tp (玩家) (x) (y) (z)"
  tphere: "<prefix><white>用法：<gold>/tphere (玩家)"
  tpall: "<prefix><white>用法：<gold>/tpall [玩家]"
  tppos: "<prefix><white>用法：<gold>/tppos (x) (y) (z) [yaw pitch] [世界]"
  tpo: "<prefix><white>用法：<gold>/tpo (玩家) [玩家]"
  tpohere: "<prefix><white>用法：<gold>/tpohere (玩家)"
  delhome: "<prefix><white>用法：<gold>/delhome (名稱|玩家:名稱)"
  homes: "<prefix><white>用法：<gold>/homes (玩家)"
  setwarp: "<prefix><white>用法：<gold>/setwarp (名稱)"
  delwarp: "<prefix><white>用法：<gold>/delwarp (名稱)"
  warp: "<prefix><white>用法：<gold>/warp (名稱) [玩家] | /warp list | /warp seticon (名稱) [物品] | /warp setdesc (名稱) [描述]"
  warp-seticon: "<prefix><white>用法：<gold>/warp seticon (名稱) [物品ID]</gold>（不填物品則使用手持物品）"
  warp-setdesc: "<prefix><white>用法：<gold>/warp setdesc (名稱) [描述]</gold>（用 | 換行，不填則清除）"
  spawn: "<prefix><white>用法：<gold>/spawn [玩家]</gold> 或 <gold>/spawn ondeath [on|off]"
  spawn-ondeath: "<prefix><white>用法：<gold>/spawn ondeath [on|off]"
  rtp: "<prefix><white>用法：<gold>/rtp (世界) (玩家)"
  rtpnpc: "<prefix><white>用法：<gold>/rtpnpc (世界) (玩家) [半徑]</gold><white>，預設以 0,0 為中心、半徑 1000 格。"

teleport:
  success: "<prefix><green>傳送成功。"
  target-unavailable: "<prefix><red>傳送目標已不可用，請重新發起傳送。"
  cooldown: "<prefix><yellow>請等待 {seconds} 秒後再次傳送。"
  no-money: "<prefix><red>餘額不足，本次傳送需要 <gold>{cost}</gold>。"
  payer-no-money: "<prefix><red>{player} 餘額不足，無法支付本次傳送。"
  charged: "<prefix><white>已扣除傳送費用 <gold>{cost}</gold>。"
  warmup: "<prefix><yellow>將在 {seconds} 秒後傳送{hint}"
  warmup-hint: "<white>，請不要移動。"
  warmup-cancelled: "<prefix><red>你移動了或受到傷害，傳送已取消。"
  unsafe: "<prefix><red>目標附近沒有安全落點，請更換位置後重試。"
  land-denied: "<prefix><red>目標位置位於他人領地，你沒有傳送進入的權限。"
  failed: "<prefix><red>傳送未完成，請確認目標位置可用後重試。"

tpa:
  self: "<prefix><red>你不能向自己發送傳送請求。"
  target-disabled: "<prefix><red>{player} 已關閉傳送請求。"
  sent: "<prefix><green>已向 <yellow>{player}</yellow> 發送傳送請求，<white>{seconds} 秒後過期。<white>輸入 /tpacancel 取消。"
  sent-here: "<prefix><green>已請求 <yellow>{player}</yellow> 傳送到你這裡，<white>{seconds} 秒後過期。"
  received: "<prefix><yellow>{player}</yellow> <aqua>請求傳送到你這裡。<white>（{seconds} 秒內有效）"
  received-here: "<prefix><yellow>{player}</yellow> <aqua>請求你傳送到對方的位置。<white>（{seconds} 秒內有效）"
  button-accept: "<green><bold>[接受]</bold></green>"
  button-accept-hover: "<green>按此接受 {player} 的請求"
  button-deny: "<red><bold>[拒絕]</bold></red>"
  button-deny-hover: "<red>按此拒絕 {player} 的請求"
  requester-offline: "<prefix><red>{player} 已離線。"
  accepted-target: "<prefix><green>已接受 <yellow>{player}</yellow> 的傳送請求。"
  accepted-requester: "<prefix><green><yellow>{player}</yellow> 接受了你的傳送請求。"
  target-gone: "<prefix><red>對方已離線，傳送取消。"
  teleported: "<prefix><green>已傳送到 <yellow>{player}</yellow> 身邊。"
  denied-target: "<prefix><white>已拒絕 <yellow>{player}</yellow> 的傳送請求。"
  denied-requester: "<prefix><red><yellow>{player}</yellow> 拒絕了你的傳送請求。"
  cancelled-target: "<prefix><white>{player} 取消了傳送請求。"
  cancelled: "<prefix><green>已取消 <yellow>{count}</yellow> 個傳送請求。"
  expired-requester: "<prefix><white>你發給 {player} 的傳送請求已過期。"
  expired-target: "<prefix><white>{player} 的傳送請求已過期。"
  all-sent: "<prefix><green>已向 <yellow>{count}</yellow> 名玩家發送 tpahere 請求。"
  none: "<prefix><yellow>目前沒有待處理的傳送請求。"
  none-outgoing: "<prefix><yellow>目前沒有發出的傳送請求。"
  toggle-on: "<prefix><green>已開啟接收傳送請求。"
  toggle-off: "<prefix><yellow>已關閉接收傳送請求。"

admin:
  tp-self: "<prefix><green>已傳送到 <yellow>{player}</yellow>。"
  tp-moved: "<prefix><green>你被傳送到 <yellow>{player}</yellow> 處。"
  tp-others: "<prefix><green>已將 <yellow>{player}</yellow> 傳送到 <yellow>{target}</yellow>。"
  tp-coords: "<prefix><green>已傳送到 <yellow>{x}, {y}, {z}</yellow>。"
  tphere: "<prefix><green>已將 <yellow>{player}</yellow> 傳送到你身邊。"
  tpall: "<prefix><green>已將 <yellow>{count}</yellow> 名玩家傳送到 <yellow>{player}</yellow> 處。"
  top: "<prefix><green>已傳送到最高處。"
  bottom: "<prefix><green>已傳送到最低的安全位置。"
  world-list: "<prefix><white>可用世界：<yellow>{worlds}"
  world: "<prefix><green>已傳送到世界 <yellow>{world}</yellow>。"

home:
  invalid-name: "<prefix><red>家的名稱只可包含中英文字、數字、底線及短橫線（最多 32 個字元）。"
  reserved-name: "<prefix><red>bed 是保留名稱（牀重生點）。"
  land-denied: "<prefix><red>你不能在他人領地內設定家。"
  limit: "<prefix><red>你最多只能設定 <yellow>{max}</yellow> 個家。"
  set: "<prefix><green>已設定家 <yellow>{name}</yellow>。"
  updated: "<prefix><green>已更新家 <yellow>{name}</yellow> 的位置。"
  set-other: "<prefix><green>已為 <yellow>{player}</yellow> 設定家 <yellow>{name}</yellow>。"
  none: "<prefix><yellow>尚未設定家，使用 <gold>/sethome [名稱]</gold> 儲存目前位置。"
  none-other: "<prefix><red>{player} 沒有任何家。"
  not-found: "<prefix><red>家 <yellow>{name}</yellow> 不存在。"
  deleted: "<prefix><green>已刪除家 <yellow>{name}</yellow>。"
  deleted-other: "<prefix><green>已刪除 <yellow>{player}</yellow> 的家 <yellow>{name}</yellow>。"
  no-bed: "<prefix><red>你沒有牀或重生錨重生點。"
  teleported: "<prefix><green>歡迎回家 <yellow>{name}</yellow>。"
  list-header: "<prefix><white>你的家（<yellow>{count}</yellow>/<yellow>{max}</yellow>），按此傳送："
  list-header-other: "<prefix><white>{player} 的家（<yellow>{count}</yellow>），按此傳送："
  list-separator: "<aqua>, "
  list-entry: "<aqua><u>{name}</u></aqua>"
  list-hover: "<white>{location}<newline><green>按此傳送到 {name}"

warp:
  invalid-name: "<prefix><red>地標名稱只可包含中英文字、數字、底線及短橫線（最多 32 個字元）。"
  set: "<prefix><green>已建立地標 <yellow>{name}</yellow>。"
  updated: "<prefix><green>已更新地標 <yellow>{name}</yellow> 的位置。"
  not-found: "<prefix><red>地標 <yellow>{name}</yellow> 不存在或你沒有權限。"
  deleted: "<prefix><green>已刪除地標 <yellow>{name}</yellow>。"
  teleported: "<prefix><green>已傳送到地標 <yellow>{name}</yellow>。"
  sent-other: "<prefix><green>已將 <yellow>{player}</yellow> 傳送到地標 <yellow>{name}</yellow>。"
  none: "<prefix><yellow>目前沒有可用的地標。"
  list-header: "<prefix><white>可用地標（<yellow>{count}</yellow>），按此傳送："
  list-separator: "<aqua>, "
  list-entry: "<gold><u>{name}</u></gold>"
  list-hover: "<white>{location}<newline><green>按此傳送到 {name}"
  list-hover-cost: "<white>{location}<newline><yellow>費用：{cost}<newline><green>按此傳送到 {name}"
  reserved-name: "<prefix><red>list、seticon、setdesc 為保留名稱，不能用作地標名。"
  bad-icon: "<prefix><red>未知物品 <yellow>{icon}</yellow>。"
  hold-item: "<prefix><red>請手持要作為圖標的物品，或在指令中指定物品 ID。"
  icon-set: "<prefix><green>已將地標 <yellow>{name}</yellow> 的圖標設為 <yellow>{icon}</yellow>。"
  desc-set: "<prefix><green>已設定地標 <yellow>{name}</yellow> 的描述。"
  desc-cleared: "<prefix><green>已清除地標 <yellow>{name}</yellow> 的描述。"

gui:
  title: "<dark_aqua>地標清單 <white>({page}/{pages})"
  item-name: "<gold><bold>{name}"
  lore-location: "<white>位置：<white>{location}"
  lore-cost: "<white>費用：<yellow>{cost}"
  lore-click: "<green>▶ 按此傳送"
  page-info: "<white>第 {page}/{pages} 頁"
  prev: "<yellow>« 上一頁"
  next: "<yellow>下一頁 »"
  close: "<red>關閉"

spawn:
  set: "<prefix><green>已將出生點設定為目前位置。"
  unset: "<prefix><red>出生點不可用。"
  teleported: "<prefix><green>已傳送到出生點。"
  sent-other: "<prefix><green>已將 <yellow>{player}</yellow> 傳送到出生點。"
  death-hint: "<prefix><white>死亡後已返回主城。<click:run_command:'/spawn ondeath off'><yellow>[關閉死亡回主城]</yellow></click><white>，也可輸入 <gold>/spawn ondeath off</gold>。"
  death-enabled: "<prefix><green>已開啟死亡回主城。<white>輸入 <gold>/spawn ondeath off</gold> 可關閉。"
  death-disabled: "<prefix><green>已關閉死亡回主城。<white>輸入 <gold>/spawn ondeath on</gold> 可開啟。"

back:
  none: "<prefix><yellow>目前沒有可以返回的位置。"
  teleported: "<prefix><green>已返回上一個位置。"
  death-hint: "<prefix><white>輸入 <gold>/back</gold> 返回死亡地點。"

rtp:
  invalid-radius: "<prefix><red>半徑須為 1 至 {max} 的整數。"
  world-disabled: "<prefix><yellow>該世界未開啟隨機傳送，請選擇其他世界。"
  searching: "<prefix><yellow>正在尋找安全位置，請稍候。"
  failed: "<prefix><red>未能找到合適的隨機位置，請稍後再試。"
  success: "<prefix><green>已隨機傳送到 <yellow>{world} {x}, {y}, {z}</yellow>。"
  sent-other: "<prefix><green>已對 <yellow>{player}</yellow> 執行隨機傳送。"
