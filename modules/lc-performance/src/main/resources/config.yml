# GPL-3.0-only。内置 LagFixer 移植来源 lychee/lajczik；保留第三方许可与来源说明。
# 所有改变玩法/删除实体的优化均需服主显式启用；先备份，在测试世界逐项验证。
sampling:
  interval-seconds: 5 # 1..300秒，只采样公开计数器
cleaner:
  enabled: false # LC 有界掉落物清理；永久删除，无回收仓库
  minimum-age-seconds: 240
  batch-size: 32
  batch-ticks: 20
  tracking-capacity: 4096
  protect-player-drops: true
# 内置GPL移植。世界列表支持'*'；与独立上游插件/外部monitor桥接分开。
embedded:
  lag-shield:
    enabled: false
    worlds: ['*']
    threshold-tps: 16
    recovery-tps: 18
    pause-spawns: true
    pause-hoppers: true
    pause-redstone: true
    pause-liquids: true
    pause-projectiles: true
    dynamic-distances: false
    low-view-distance: 4
    low-simulation-distance: 3
  redstone:
    enabled: false
    worlds: ['*']
    ticks_limit:
      redstone: 500 # 每40 tick窗口
      piston: 200 # 每40 tick窗口累计推方块数
    click-cooldown-ticks: 0 # 0关闭点击冷却；单位tick
    piston:
      push_blacklist: []
  explosion:
    enabled: false
    worlds: ['*']
    maximum-radius: 4.0
    maximum-drop-yield: 1.0
    yield_limit:
      enabled: false
    anti_chain:
      enabled: false
      radius: 5.0
      cooldown-ticks: 20
      max_chain_size: 8
      prevent_block_ignition: false
  leaf-decay:
    enabled: false
    worlds: ['*']
    max-decays-per-tick: 32
    queue-capacity: 4096
  hopper:
    enabled: false
    worlds: ['*']
    smart_throttling:
      enabled: false
    transfer-cooldown-ticks: 8
    chunk_limiting:
      enabled: false
      max-transfers-per-second: 256
  entity-limiter:
    enabled: false
    worlds: ['*']
    whitelist: []
    creatures: 0 # 0表示不限制，非上游的-1
    items: 0 # 不取消ItemSpawn；仅显式overflow清理
    vehicles: 0
    projectiles: 0
    reasons: [] # 空列表不阻止生物生成
    overflow-purge:
      enabled: false
      limit-multiplier: 2.0
      types:
        creatures: false
        items: false
        vehicles: false
        projectiles: false
  world-cleaner:
    enabled: false
    worlds: ['*']
    interval-seconds: 300
    chunks-per-batch: 2
    entities-per-batch: 128
    items:
      enabled: false
      min-age-seconds: 300
      blacklist: []
      abyss:
        enabled: false
    creatures:
      enabled: false
      list-mode: true
      list: []
    projectiles:
      enabled: false
      min-age-seconds: 60
      list-mode: true
      list: []
  trash-disposal:
    enabled: false
    worlds: ['*']
    permission: lc.performance.trash
    global: false
    max-inventories: 128
    store-items: false # false：关闭个人垃圾箱即删除；请知悉后启用总开关
    forced-trash: false
    cleanup:
      enabled: false
      interval-seconds: 300
  ability-limiter:
    enabled: false
    worlds: ['*']
    elytra-boost:
      cooldown-ticks: 0
      additional-durability-loss: 0
    trident-riptide:
      cooldown-ticks: 0
      additional-durability-loss: 0
  afk:
    enabled: false
    worlds: ['*']
    players-per-check: 16
    max-tracked-players: 512
    check-mode: 1 # 0位置或朝向不变；1位置和朝向均不变；2位置；3朝向
    kick:
      enabled: false
      after-seconds: 1800
    teleport:
      enabled: false
      after-seconds: 600
      world: ''
      x: 0
      y: 80
      z: 0
      return-on-activity: true
    hide-entities:
      enabled: false
      after-seconds: 300
      radius: 32
      max-per-player: 128
      include-players: false
  mob-ai:
    enabled: false # Paper26.3 NMS适配，先验证寻路/繁殖及关闭恢复
    worlds: ['*']
    scan:
      entities-per-tick: 128
      chunks-per-tick: 2
      cache-limit: 4096
    collides: true
    silent: false
    spawn_reasons: []
    list_mode: false
    list: []
    entities:
      animals: true
      monsters: true
      villagers: true
      tameable: false # 默认保护可驯服/宠物类别，不参与AI替换
      others: true
    pathfinder:
      keep_dedicated: true
      list_mode: true # 仅移除包含list词条的目标；空列表不额外移除
      list: []
    animals:
      breed:
        enabled: true
        range: 8.0
        speed: 1.0
        event: true
        teleport: false
      tempt:
        enabled: true
        range: 10.0
        speed: 1.0
        cooldown: 10 # tick
        trigger_both_hands: true
        event: true
        teleport: false
  vehicle:
    enabled: false # NMS替换普通空载船/矿车，关闭时尝试恢复
    worlds: ['*']
    scan:
      entities-per-tick: 128
      chunks-per-tick: 2
      cache-limit: 4096
    boat:
      enabled: true
      collides: false
      pushable: false
      silent: false
    minecart:
      enabled: true
      collides: false
      pushable: false
      silent: false
  console-filter:
    enabled: false
    worlds: ['*']
    patterns: [] # 仅显式过滤匹配日志，不删除历史日志
