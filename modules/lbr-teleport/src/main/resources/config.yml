# ============================================================
#  LunarCore 传送模块（teleport）配置
#  修改后执行 /lc module reload teleport 或在网页面板保存
# ============================================================

teleport:
  # 默认预热秒数（传送前需要站立不动的时间），0 为立即传送
  # 拥有 lbr.teleport.bypass.warmup 权限的玩家跳过预热
  warmup: 3
  # 预热期间移动（改变所在方块）是否取消传送
  cancel-on-move: true
  # 预热期间受到伤害是否取消传送
  cancel-on-damage: true
  # 是否启用安全落点检查（避免岩浆/虚空/窒息，自动向上寻找安全位置）
  # 创造/旁观模式或正在飞行的玩家不做检查
  safe-location: true
  # 安全落点水平搜索半径（方块）
  safe-search-radius: 3
  # Paper 下使用 Player#teleportAsync（异步加载区块）；false 则始终使用 Bukkit teleport
  use-async: true
  # 目标位置在他人领地且 LandService 判断无 TELEPORT 权限时拒绝（lbr.teleport.bypass.land 绕过）
  check-land: true

# 按命令覆盖预热秒数，未列出的使用 teleport.warmup
warmups:
  tpa: 3
  tpahere: 3
  home: 3
  warp: 3
  spawn: 3
  back: 3
  rtp: 5

# 按命令冷却秒数（传送成功后开始计时），0 为无冷却；lbr.teleport.bypass.cooldown 绕过
cooldowns:
  tpa: 0
  tpahere: 0
  home: 0
  warp: 0
  spawn: 0
  back: 0
  rtp: 300

# 按命令费用（需要 economy 模块，未安装时免费）；lbr.teleport.bypass.cost 绕过
# tpa/tpahere 由发起请求的玩家支付
costs:
  tpa: 0
  tpahere: 0
  home: 0
  sethome: 0
  warp: 0
  spawn: 0
  back: 0
  rtp: 0

tpa:
  # 请求超时秒数
  timeout: 120

homes:
  # 默认家数量上限（无任何 lbr.teleport.homes.* 权限时）
  default-limit: 3
  # 组上限：拥有 lbr.teleport.homes.<组名> 权限即获得对应上限，取最大值
  # 另外也支持数字权限 lbr.teleport.homes.<数量>（如 lbr.teleport.homes.10），以及 lbr.teleport.homes.unlimited
  groups:
    vip: 5
    svip: 10
  # 是否允许把床/重生锚重生点作为名为 bed 的家（/home bed）
  bed-home: true
  # 死亡重生时，若没有床则重生到名为 home 的家（优先于 spawn.on-respawn）
  respawn-at-home: false

warps:
  # true：所有地标都需要 lbr.teleport.warp.<名> 权限；false：仅单独设置了“需要权限”的地标需要
  per-warp-permission: false
  # /warps 箱子 GUI（/warps list 始终为文本列表）
  gui:
    # false 则 /warps 显示可点击文本列表
    enabled: true
    # 行数 2-6，最后一行为翻页栏
    rows: 6
    # 未设置图标的地标使用的物品（物品 ID）；用 /warp seticon <名> 以手持物品设置单个图标
    default-icon: ENDER_PEARL
    # 翻页栏填充物品，留空则不填充
    filler: GRAY_STAINED_GLASS_PANE

spawn:
  # 新玩家首次加入到已设置的主城
  on-first-join: true
  # 每天首次上线到已设置的主城，同一天重连保留退出位置
  on-daily-first-join: true
  # 留空使用服务器本地时区，也可填写 Asia/Shanghai 等时区
  daily-join-timezone: ""
  # 允许死亡重生到主城；玩家可用 /spawn ondeath off 单独关闭
  on-respawn: true
  # 尚未选择的玩家默认开启死亡回主城
  respawn-default-enabled: true
  # true：即使有床/重生锚也重生到 spawn；false：有床时尊重床
  respawn-ignore-bed: false

back:
  # 死亡时记录死亡点供 /back 使用（玩家还需拥有 lbr.teleport.back.ondeath）
  on-death: true
  # 将 /back 位置持久化到数据库（表 lbr_teleport_back），重启后仍可返回；false 则仅保存在内存
  persist: true

rtp:
  # 最大尝试次数（每次尝试会异步加载一个区块）
  max-attempts: 20
  # 不传送到这些生物群系（匹配群系 key 中的关键字，如 ocean 匹配所有海洋）
  avoid-biomes: [ocean, river]
  # 避开领地
  avoid-lands: true
  # 执行 /rtp 不带世界参数且所在世界不在白名单时使用的世界
  default-world: world
  # 世界白名单及参数：center-x/center-z 中心，min-radius/max-radius 半径范围（方形环）
  worlds:
    world:
      center-x: 0
      center-z: 0
      min-radius: 200
      max-radius: 5000
