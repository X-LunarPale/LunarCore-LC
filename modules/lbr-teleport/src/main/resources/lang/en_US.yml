# Teleport module language file (MiniMessage)

common:
  player-not-found: "<prefix><red>Player <yellow>{player}</yellow> is not online."
  player-unknown: "<prefix><red>Player <yellow>{player}</yellow> has never joined."
  player-only: "<prefix><red>Only players can use this command."
  no-permission: "<prefix><red>You don't have permission."
  bad-coords: "<prefix><red>Invalid coordinates (numbers or ~ relative)."
  world-not-found: "<prefix><red>World <yellow>{world}</yellow> not found."
  error: "<prefix><red>Failed to read data, try again later."

usage:
  tpa: "<prefix><gray>Usage: <gold>/tpa (player)"
  tpahere: "<prefix><gray>Usage: <gold>/tpahere (player)"
  tp: "<prefix><gray>Usage: <gold>/tp (player) | (player) (player) | (x) (y) (z) | (player) (x) (y) (z)"
  tphere: "<prefix><gray>Usage: <gold>/tphere (player)"
  tpall: "<prefix><gray>Usage: <gold>/tpall [player]"
  tppos: "<prefix><gray>Usage: <gold>/tppos (x) (y) (z) [yaw pitch] [world]"
  tpo: "<prefix><gray>Usage: <gold>/tpo (player) [player]"
  tpohere: "<prefix><gray>Usage: <gold>/tpohere (player)"
  delhome: "<prefix><gray>Usage: <gold>/delhome (name|player:name)"
  homes: "<prefix><gray>Usage: <gold>/homes (player)"
  setwarp: "<prefix><gray>Usage: <gold>/setwarp (name)"
  delwarp: "<prefix><gray>Usage: <gold>/delwarp (name)"
  warp: "<prefix><gray>Usage: <gold>/warp (name) [player] | /warp list | /warp seticon (name) [item] | /warp setdesc (name) [text]"
  warp-seticon: "<prefix><gray>Usage: <gold>/warp seticon (name) [item]</gold> (held item if omitted)"
  warp-setdesc: "<prefix><gray>Usage: <gold>/warp setdesc (name) [text]</gold> (| for new line, empty clears)"
  spawn: "<prefix><gray>Usage: <gold>/spawn (player)"
  rtp: "<prefix><gray>Usage: <gold>/rtp (world) (player)"

teleport:
  success: "<prefix><green>Teleported."
  target-unavailable: "<prefix><red>Teleport target is no longer available."
  cooldown: "<prefix><red>Teleport on cooldown, wait <yellow>{seconds}</yellow>s."
  no-money: "<prefix><red>Insufficient funds, this teleport costs <gold>{cost}</gold>."
  payer-no-money: "<prefix><red>{player} cannot afford this teleport."
  charged: "<prefix><gray>Charged <gold>{cost}</gold>."
  warmup: "<prefix><aqua>Teleporting in <yellow>{seconds}</yellow>s{hint}"
  warmup-hint: "<gray>, don't move."
  warmup-cancelled: "<prefix><red>Teleport cancelled because you moved or took damage."
  unsafe: "<prefix><red>Destination is unsafe and no safe spot was found nearby."
  land-denied: "<prefix><red>The destination is in a land where you may not teleport."
  failed: "<prefix><red>Teleport failed."

tpa:
  self: "<prefix><red>You can't send a request to yourself."
  target-disabled: "<prefix><red>{player} has teleport requests disabled."
  sent: "<prefix><green>Request sent to <yellow>{player}</yellow>, expires in {seconds}s."
  sent-here: "<prefix><green>Asked <yellow>{player}</yellow> to teleport to you, expires in {seconds}s."
  received: "<prefix><yellow>{player}</yellow> <aqua>wants to teleport to you. <gray>({seconds}s)"
  received-here: "<prefix><yellow>{player}</yellow> <aqua>wants you to teleport to them. <gray>({seconds}s)"
  button-accept: "<green><bold>[Accept]</bold></green>"
  button-accept-hover: "<green>Accept {player}'s request"
  button-deny: "<red><bold>[Deny]</bold></red>"
  button-deny-hover: "<red>Deny {player}'s request"
  requester-offline: "<prefix><red>{player} is offline."
  accepted-target: "<prefix><green>Accepted <yellow>{player}</yellow>'s request."
  accepted-requester: "<prefix><green><yellow>{player}</yellow> accepted your request."
  target-gone: "<prefix><red>The other player went offline."
  teleported: "<prefix><green>Teleported to <yellow>{player}</yellow>."
  denied-target: "<prefix><gray>Denied <yellow>{player}</yellow>'s request."
  denied-requester: "<prefix><red><yellow>{player}</yellow> denied your request."
  cancelled-target: "<prefix><gray>{player} cancelled the request."
  cancelled: "<prefix><green>Cancelled <yellow>{count}</yellow> request(s)."
  expired-requester: "<prefix><gray>Your request to {player} expired."
  expired-target: "<prefix><gray>{player}'s request expired."
  all-sent: "<prefix><green>Sent tpahere to <yellow>{count}</yellow> players."
  none: "<prefix><red>You have no pending requests."
  none-outgoing: "<prefix><red>You have no outgoing requests."
  toggle-on: "<prefix><green>Teleport requests enabled."
  toggle-off: "<prefix><yellow>Teleport requests disabled."

admin:
  tp-self: "<prefix><green>Teleported to <yellow>{player}</yellow>."
  tp-moved: "<prefix><green>You were teleported to <yellow>{player}</yellow>."
  tp-others: "<prefix><green>Teleported <yellow>{player}</yellow> to <yellow>{target}</yellow>."
  tp-coords: "<prefix><green>Teleported to <yellow>{x}, {y}, {z}</yellow>."
  tphere: "<prefix><green>Teleported <yellow>{player}</yellow> to you."
  tpall: "<prefix><green>Teleported <yellow>{count}</yellow> players to <yellow>{player}</yellow>."
  top: "<prefix><green>Teleported to the top."
  bottom: "<prefix><green>Teleported to the lowest safe spot."
  world-list: "<prefix><gray>Worlds: <yellow>{worlds}"
  world: "<prefix><green>Teleported to world <yellow>{world}</yellow>."

home:
  invalid-name: "<prefix><red>Invalid home name."
  reserved-name: "<prefix><red>'bed' is reserved."
  land-denied: "<prefix><red>You can't set a home in someone else's land."
  limit: "<prefix><red>You can only have <yellow>{max}</yellow> homes."
  set: "<prefix><green>Home <yellow>{name}</yellow> set."
  updated: "<prefix><green>Home <yellow>{name}</yellow> moved."
  set-other: "<prefix><green>Set home <yellow>{name}</yellow> for <yellow>{player}</yellow>."
  none: "<prefix><red>You have no homes. Use <gold>/sethome [name]</gold>."
  none-other: "<prefix><red>{player} has no homes."
  not-found: "<prefix><red>Home <yellow>{name}</yellow> not found."
  deleted: "<prefix><green>Home <yellow>{name}</yellow> deleted."
  deleted-other: "<prefix><green>Deleted <yellow>{player}</yellow>'s home <yellow>{name}</yellow>."
  no-bed: "<prefix><red>You have no bed or respawn anchor."
  teleported: "<prefix><green>Welcome home: <yellow>{name}</yellow>."
  list-header: "<prefix><gray>Your homes (<yellow>{count}</yellow>/<yellow>{max}</yellow>), click to teleport:"
  list-header-other: "<prefix><gray>{player}'s homes (<yellow>{count}</yellow>):"
  list-separator: "<dark_gray>, "
  list-entry: "<aqua><u>{name}</u></aqua>"
  list-hover: "<gray>{location}<newline><green>Click to teleport to {name}"

warp:
  invalid-name: "<prefix><red>Invalid warp name."
  set: "<prefix><green>Warp <yellow>{name}</yellow> created."
  updated: "<prefix><green>Warp <yellow>{name}</yellow> moved."
  not-found: "<prefix><red>Warp <yellow>{name}</yellow> not found or no permission."
  deleted: "<prefix><green>Warp <yellow>{name}</yellow> deleted."
  teleported: "<prefix><green>Warped to <yellow>{name}</yellow>."
  sent-other: "<prefix><green>Sent <yellow>{player}</yellow> to warp <yellow>{name}</yellow>."
  none: "<prefix><red>No warps available."
  list-header: "<prefix><gray>Warps (<yellow>{count}</yellow>), click to teleport:"
  list-separator: "<dark_gray>, "
  list-entry: "<gold><u>{name}</u></gold>"
  list-hover: "<gray>{location}<newline><green>Click to warp to {name}"
  list-hover-cost: "<gray>{location}<newline><yellow>Cost: {cost}<newline><green>Click to warp to {name}"
  reserved-name: "<prefix><red>list, seticon and setdesc are reserved names."
  bad-icon: "<prefix><red>Unknown item <yellow>{icon}</yellow>."
  hold-item: "<prefix><red>Hold the item to use as icon, or specify an item id."
  icon-set: "<prefix><green>Icon of <yellow>{name}</yellow> set to <yellow>{icon}</yellow>."
  desc-set: "<prefix><green>Description of <yellow>{name}</yellow> set."
  desc-cleared: "<prefix><green>Description of <yellow>{name}</yellow> cleared."

gui:
  title: "<dark_aqua>Warps <gray>({page}/{pages})"
  item-name: "<gold><bold>{name}"
  lore-location: "<gray>Location: <white>{location}"
  lore-cost: "<gray>Cost: <yellow>{cost}"
  lore-click: "<green>▶ Click to teleport"
  page-info: "<gray>Page {page}/{pages}"
  prev: "<yellow>« Previous"
  next: "<yellow>Next »"
  close: "<red>Close"

spawn:
  set: "<prefix><green>Spawn set to your location."
  unset: "<prefix><red>Spawn is not available."
  teleported: "<prefix><green>Teleported to spawn."
  sent-other: "<prefix><green>Sent <yellow>{player}</yellow> to spawn."

back:
  none: "<prefix><red>No previous location."
  teleported: "<prefix><green>Returned to your previous location."
  death-hint: "<prefix><gray>Use <gold>/back</gold> to return to where you died."

rtp:
  world-disabled: "<prefix><red>Random teleport is disabled in this world."
  searching: "<prefix><aqua>Searching for a safe random location..."
  failed: "<prefix><red>Could not find a suitable location, try again later."
  success: "<prefix><green>Randomly teleported to <yellow>{world} {x}, {y}, {z}</yellow>."
  sent-other: "<prefix><green>Random teleported <yellow>{player}</yellow>."
