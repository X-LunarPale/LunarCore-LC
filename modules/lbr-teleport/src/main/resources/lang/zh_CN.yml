# 传送模块语言文件（MiniMessage 格式，<prefix> 为统一前缀，{name} 为占位符）
prefix: "<dark_gray>[</dark_gray><light_purple><bold>传送</bold></light_purple><dark_gray>]</dark_gray> "
# 用法说明中 (参数) 为必填，[参数] 为可选

common:
  player-not-found: "<prefix><red>找不到在线玩家 <yellow>{player}</yellow>。"
  player-unknown: "<prefix><red>从未见过玩家 <yellow>{player}</yellow>。"
  player-only: "<prefix><red>该命令只能由玩家执行。"
  no-permission: "<prefix><red>你没有权限这样做。"
  bad-coords: "<prefix><red>坐标格式错误，可使用数字或 ~ 相对坐标。"
  world-not-found: "<prefix><red>世界 <yellow>{world}</yellow> 不存在或未加载。"
  error: "<prefix><red>读取数据时出错，请稍后再试。"

usage:
  tpa: "<prefix><gray>用法：<gold>/tpa (玩家)"
  tpahere: "<prefix><gray>用法：<gold>/tpahere (玩家)"
  tp: "<prefix><gray>用法：<gold>/tp (玩家) | /tp (玩家) (玩家) | /tp (x) (y) (z) | /tp (玩家) (x) (y) (z)"
  tphere: "<prefix><gray>用法：<gold>/tphere (玩家)"
  tpall: "<prefix><gray>用法：<gold>/tpall [玩家]"
  tppos: "<prefix><gray>用法：<gold>/tppos (x) (y) (z) [yaw pitch] [世界]"
  tpo: "<prefix><gray>用法：<gold>/tpo (玩家) [玩家]"
  tpohere: "<prefix><gray>用法：<gold>/tpohere (玩家)"
  delhome: "<prefix><gray>用法：<gold>/delhome (名称|玩家:名称)"
  homes: "<prefix><gray>用法：<gold>/homes (玩家)"
  setwarp: "<prefix><gray>用法：<gold>/setwarp (名称)"
  delwarp: "<prefix><gray>用法：<gold>/delwarp (名称)"
  warp: "<prefix><gray>用法：<gold>/warp (名称) [玩家] | /warp list | /warp seticon (名称) [物品] | /warp setdesc (名称) [描述]"
  warp-seticon: "<prefix><gray>用法：<gold>/warp seticon (名称) [物品ID]</gold>（不填物品则使用手持物品）"
  warp-setdesc: "<prefix><gray>用法：<gold>/warp setdesc (名称) [描述]</gold>（用 | 换行，不填则清除）"
  spawn: "<prefix><gray>用法：<gold>/spawn [玩家]</gold> 或 <gold>/spawn ondeath [on|off]"
  spawn-ondeath: "<prefix><gray>用法：<gold>/spawn ondeath [on|off]"
  rtp: "<prefix><gray>用法：<gold>/rtp (世界) (玩家)"

teleport:
  success: "<prefix><green>传送成功。"
  target-unavailable: "<prefix><red>传送目标已不可用。"
  cooldown: "<prefix><red>传送冷却中，请等待 <yellow>{seconds}</yellow> 秒。"
  no-money: "<prefix><red>余额不足，本次传送需要 <gold>{cost}</gold>。"
  payer-no-money: "<prefix><red>{player} 余额不足，无法支付本次传送。"
  charged: "<prefix><gray>已扣除传送费用 <gold>{cost}</gold>。"
  warmup: "<prefix><aqua>将在 <yellow>{seconds}</yellow> 秒后传送{hint}"
  warmup-hint: "<gray>，请不要移动。"
  warmup-cancelled: "<prefix><red>你移动了或受到伤害，传送已取消。"
  unsafe: "<prefix><red>目标位置不安全，且附近找不到安全落点。"
  land-denied: "<prefix><red>目标位置位于他人领地，你没有传送进入的权限。"
  failed: "<prefix><red>传送失败（可能被其它插件取消）。"

tpa:
  self: "<prefix><red>你不能向自己发送传送请求。"
  target-disabled: "<prefix><red>{player} 已关闭传送请求。"
  sent: "<prefix><green>已向 <yellow>{player}</yellow> 发送传送请求，<gray>{seconds} 秒后过期。<gray>输入 /tpacancel 取消。"
  sent-here: "<prefix><green>已请求 <yellow>{player}</yellow> 传送到你这里，<gray>{seconds} 秒后过期。"
  received: "<prefix><yellow>{player}</yellow> <aqua>请求传送到你这里。<gray>（{seconds} 秒内有效）"
  received-here: "<prefix><yellow>{player}</yellow> <aqua>请求你传送到 TA 那里。<gray>（{seconds} 秒内有效）"
  button-accept: "<green><bold>[接受]</bold></green>"
  button-accept-hover: "<green>点击接受 {player} 的请求"
  button-deny: "<red><bold>[拒绝]</bold></red>"
  button-deny-hover: "<red>点击拒绝 {player} 的请求"
  requester-offline: "<prefix><red>{player} 已离线。"
  accepted-target: "<prefix><green>已接受 <yellow>{player}</yellow> 的传送请求。"
  accepted-requester: "<prefix><green><yellow>{player}</yellow> 接受了你的传送请求。"
  target-gone: "<prefix><red>对方已离线，传送取消。"
  teleported: "<prefix><green>已传送到 <yellow>{player}</yellow> 身边。"
  denied-target: "<prefix><gray>已拒绝 <yellow>{player}</yellow> 的传送请求。"
  denied-requester: "<prefix><red><yellow>{player}</yellow> 拒绝了你的传送请求。"
  cancelled-target: "<prefix><gray>{player} 取消了传送请求。"
  cancelled: "<prefix><green>已取消 <yellow>{count}</yellow> 个传送请求。"
  expired-requester: "<prefix><gray>你发给 {player} 的传送请求已过期。"
  expired-target: "<prefix><gray>{player} 的传送请求已过期。"
  all-sent: "<prefix><green>已向 <yellow>{count}</yellow> 名玩家发送 tpahere 请求。"
  none: "<prefix><red>你没有待处理的传送请求。"
  none-outgoing: "<prefix><red>你没有发出的传送请求。"
  toggle-on: "<prefix><green>已开启接收传送请求。"
  toggle-off: "<prefix><yellow>已关闭接收传送请求。"

admin:
  tp-self: "<prefix><green>已传送到 <yellow>{player}</yellow>。"
  tp-moved: "<prefix><green>你被传送到 <yellow>{player}</yellow> 处。"
  tp-others: "<prefix><green>已将 <yellow>{player}</yellow> 传送到 <yellow>{target}</yellow>。"
  tp-coords: "<prefix><green>已传送到 <yellow>{x}, {y}, {z}</yellow>。"
  tphere: "<prefix><green>已将 <yellow>{player}</yellow> 传送到你身边。"
  tpall: "<prefix><green>已将 <yellow>{count}</yellow> 名玩家传送到 <yellow>{player}</yellow> 处。"
  top: "<prefix><green>已传送到最高处。"
  bottom: "<prefix><green>已传送到最低的安全位置。"
  world-list: "<prefix><gray>可用世界：<yellow>{worlds}"
  world: "<prefix><green>已传送到世界 <yellow>{world}</yellow>。"

home:
  invalid-name: "<prefix><red>家名称只能包含中英文、数字、下划线和短横线（最多 32 字符）。"
  reserved-name: "<prefix><red>bed 是保留名称（床重生点）。"
  land-denied: "<prefix><red>你不能在他人领地内设置家。"
  limit: "<prefix><red>你最多只能设置 <yellow>{max}</yellow> 个家。"
  set: "<prefix><green>已设置家 <yellow>{name}</yellow>。"
  updated: "<prefix><green>已更新家 <yellow>{name}</yellow> 的位置。"
  set-other: "<prefix><green>已为 <yellow>{player}</yellow> 设置家 <yellow>{name}</yellow>。"
  none: "<prefix><red>你还没有设置家，使用 <gold>/sethome [名称]</gold> 设置。"
  none-other: "<prefix><red>{player} 没有任何家。"
  not-found: "<prefix><red>家 <yellow>{name}</yellow> 不存在。"
  deleted: "<prefix><green>已删除家 <yellow>{name}</yellow>。"
  deleted-other: "<prefix><green>已删除 <yellow>{player}</yellow> 的家 <yellow>{name}</yellow>。"
  no-bed: "<prefix><red>你没有床或重生锚重生点。"
  teleported: "<prefix><green>欢迎回家 <yellow>{name}</yellow>。"
  list-header: "<prefix><gray>你的家（<yellow>{count}</yellow>/<yellow>{max}</yellow>），点击传送："
  list-header-other: "<prefix><gray>{player} 的家（<yellow>{count}</yellow>），点击传送："
  list-separator: "<dark_gray>, "
  list-entry: "<aqua><u>{name}</u></aqua>"
  list-hover: "<gray>{location}<newline><green>点击传送到 {name}"

warp:
  invalid-name: "<prefix><red>地标名称只能包含中英文、数字、下划线和短横线（最多 32 字符）。"
  set: "<prefix><green>已创建地标 <yellow>{name}</yellow>。"
  updated: "<prefix><green>已更新地标 <yellow>{name}</yellow> 的位置。"
  not-found: "<prefix><red>地标 <yellow>{name}</yellow> 不存在或你没有权限。"
  deleted: "<prefix><green>已删除地标 <yellow>{name}</yellow>。"
  teleported: "<prefix><green>已传送到地标 <yellow>{name}</yellow>。"
  sent-other: "<prefix><green>已将 <yellow>{player}</yellow> 传送到地标 <yellow>{name}</yellow>。"
  none: "<prefix><red>当前没有可用的地标。"
  list-header: "<prefix><gray>可用地标（<yellow>{count}</yellow>），点击传送："
  list-separator: "<dark_gray>, "
  list-entry: "<gold><u>{name}</u></gold>"
  list-hover: "<gray>{location}<newline><green>点击传送到 {name}"
  list-hover-cost: "<gray>{location}<newline><yellow>费用：{cost}<newline><green>点击传送到 {name}"
  reserved-name: "<prefix><red>list、seticon、setdesc 为保留名称，不能用作地标名。"
  bad-icon: "<prefix><red>未知物品 <yellow>{icon}</yellow>。"
  hold-item: "<prefix><red>请手持要作为图标的物品，或在命令中指定物品 ID。"
  icon-set: "<prefix><green>已将地标 <yellow>{name}</yellow> 的图标设为 <yellow>{icon}</yellow>。"
  desc-set: "<prefix><green>已设置地标 <yellow>{name}</yellow> 的描述。"
  desc-cleared: "<prefix><green>已清除地标 <yellow>{name}</yellow> 的描述。"

gui:
  title: "<dark_aqua>地标列表 <gray>({page}/{pages})"
  item-name: "<gold><bold>{name}"
  lore-location: "<gray>位置：<white>{location}"
  lore-cost: "<gray>费用：<yellow>{cost}"
  lore-click: "<green>▶ 点击传送"
  page-info: "<gray>第 {page}/{pages} 页"
  prev: "<yellow>« 上一页"
  next: "<yellow>下一页 »"
  close: "<red>关闭"

spawn:
  set: "<prefix><green>已将出生点设置为当前位置。"
  unset: "<prefix><red>出生点不可用。"
  teleported: "<prefix><green>已传送到出生点。"
  sent-other: "<prefix><green>已将 <yellow>{player}</yellow> 传送到出生点。"
  death-hint: "<prefix><gray>死亡后已返回主城。<click:run_command:'/spawn ondeath off'><yellow>[关闭死亡回主城]</yellow></click><gray>，也可输入 <gold>/spawn ondeath off</gold>。"
  death-enabled: "<prefix><green>已开启死亡回主城。<gray>输入 <gold>/spawn ondeath off</gold> 可关闭。"
  death-disabled: "<prefix><green>已关闭死亡回主城。<gray>输入 <gold>/spawn ondeath on</gold> 可开启。"

back:
  none: "<prefix><red>没有可以返回的位置。"
  teleported: "<prefix><green>已返回上一个位置。"
  death-hint: "<prefix><gray>输入 <gold>/back</gold> 返回死亡地点。"

rtp:
  world-disabled: "<prefix><red>该世界未开启随机传送。"
  searching: "<prefix><aqua>正在寻找安全的随机位置……"
  failed: "<prefix><red>未能找到合适的随机位置，请稍后再试。"
  success: "<prefix><green>已随机传送到 <yellow>{world} {x}, {y}, {z}</yellow>。"
  sent-other: "<prefix><green>已对 <yellow>{player}</yellow> 执行随机传送。"
