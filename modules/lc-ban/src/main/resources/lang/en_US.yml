# Ban module language file (MiniMessage)
prefix: "<aqua>Moderation » </aqua>"

words:
  permanent: "Permanent"
  active: "<green>Active"
  revoked: "<white>Revoked ({operator})"
  inactive: "<aqua>Inactive"

types:
  ban: "Ban"
  ban-temp: "Temp ban"
  ipban: "IP ban"
  ipban-temp: "Temp IP ban"
  mute: "Mute"
  mute-temp: "Temp mute"
  warn: "Warning"
  kick: "Kick"

operators:
  console: "Console"
  anticheat: "Anti-cheat"
  warning-ladder: "{operator} · Automatic action"

anticheat-reasons:
  timer: "Abnormal client timing"
  ground: "Invalid ground state"
  fall: "Invalid falling state"
  movement: "Invalid movement"
  knockback: "Abnormal knockback response"
  order: "Invalid action order"
  packets: "Invalid packets"
  reach: "Abnormal attack range"
  hitbox: "Invalid attack hitbox"
  vehicle: "Invalid vehicle movement"
  slowdown: "Invalid movement slowdown"
  sprint: "Invalid sprint state"
  actions: "Incompatible simultaneous actions"
  place: "Invalid block placement"
  break: "Invalid block breaking"
  pathfinding: "Abnormal automated pathfinding"
  elytra: "Invalid elytra flight"
  chat: "Abnormal chat behavior"
  exploit: "Invalid interaction"
  interaction: "Abnormal interaction"
  aim: "Abnormal aiming"
  clicks: "Abnormal click rate"
  other: "Abnormal behavior detected"

screen:
  ban:
    - "<gradient:#7ec8ff:#b98cff><bold>{server}</bold></gradient>"
    - ""
    - "<red><bold>You are permanently banned</bold>"
    - ""
    - "<white>Reason: <white>{reason}"
    - "<white>By: <white>{operator}"
    - "<white>Date: <white>{date}"
    - "<white>ID: <white>#{id}"
    - ""
    - "<white>Appeal: <aqua>{appeal}"
  tempban:
    - "<gradient:#7ec8ff:#b98cff><bold>{server}</bold></gradient>"
    - ""
    - "<red><bold>You are temporarily banned</bold>"
    - ""
    - "<white>Reason: <white>{reason}"
    - "<white>By: <white>{operator}"
    - "<white>Expires: <white>{expires}"
    - "<white>Remaining: <yellow>{remaining}"
    - "<white>ID: <white>#{id}"
    - ""
    - "<white>Appeal: <aqua>{appeal}"
  ipban:
    - "<gradient:#7ec8ff:#b98cff><bold>{server}</bold></gradient>"
    - ""
    - "<red><bold>Your IP is permanently banned</bold>"
    - ""
    - "<white>Reason: <white>{reason}"
    - "<white>ID: <white>#{id}"
    - ""
    - "<white>Appeal: <aqua>{appeal}"
  tempipban:
    - "<gradient:#7ec8ff:#b98cff><bold>{server}</bold></gradient>"
    - ""
    - "<red><bold>Your IP is temporarily banned</bold>"
    - ""
    - "<white>Reason: <white>{reason}"
    - "<white>Remaining: <yellow>{remaining}"
    - "<white>ID: <white>#{id}"
    - ""
    - "<white>Appeal: <aqua>{appeal}"
  kick:
    - "<gradient:#7ec8ff:#b98cff><bold>{server}</bold></gradient>"
    - ""
    - "<yellow><bold>You were kicked</bold>"
    - ""
    - "<white>Reason: <white>{reason}"

notify:
  muted:
    - "<gold>Mute » </gold><white>You have been permanently muted"
    - "<aqua>Reason: <white>{reason}</white> · Source: <white>{operator}"
  tempmuted:
    - "<gold>Mute » </gold><white>You have been muted for <yellow>{duration}</yellow>"
    - "<aqua>Reason: <white>{reason}</white> · Source: <white>{operator}"
  warned:
    - "<gold>Warning » </gold><white>You received a warning (<yellow>{count}</yellow> total)"
    - "<aqua>Reason: <white>{reason}</white> · Source: <white>{operator}"
  unmuted: "<gold>Mute » </gold><green>Your mute has been lifted"
  muted-chat:
    - "<gold>Mute » </gold><white>You are muted for another <yellow>{remaining}</yellow>"
    - "<aqua>Reason: <white>{reason}"
  muted-command: "<gold>Mute » </gold><white>You cannot use this command while muted (<yellow>{remaining}</yellow> left)"

broadcast:
  ban:
    - "<red>Ban » </red><yellow>{player}</yellow><white> has been permanently banned"
    - "<aqua>Reason: <white>{reason}</white> · Source: <white>{operator}"
  ban-temp:
    - "<red>Ban » </red><yellow>{player}</yellow><white> has been banned for <yellow>{duration}</yellow>"
    - "<aqua>Reason: <white>{reason}</white> · Source: <white>{operator}"
  ipban:
    - "<red>Ban » </red><yellow>{player}</yellow><white> has been permanently IP banned"
    - "<aqua>Reason: <white>{reason}</white> · Source: <white>{operator}"
  ipban-temp:
    - "<red>Ban » </red><yellow>{player}</yellow><white> has been IP banned for <yellow>{duration}</yellow>"
    - "<aqua>Reason: <white>{reason}</white> · Source: <white>{operator}"
  mute:
    - "<gold>Mute » </gold><yellow>{player}</yellow><white> has been permanently muted"
    - "<aqua>Reason: <white>{reason}</white> · Source: <white>{operator}"
  mute-temp:
    - "<gold>Mute » </gold><yellow>{player}</yellow><white> has been muted for <yellow>{duration}</yellow>"
    - "<aqua>Reason: <white>{reason}</white> · Source: <white>{operator}"
  warn:
    - "<gold>Warning » </gold><yellow>{player}</yellow><white> received a warning (<yellow>{count}</yellow> total)"
    - "<aqua>Reason: <white>{reason}</white> · Source: <white>{operator}"
  kick:
    - "<yellow>Kick » {player}</yellow><white> has been kicked"
    - "<aqua>Reason: <white>{reason}</white> · Source: <white>{operator}"
  silent-prefix: "<aqua>[Silent]</aqua> {message}"
  unban: "<red>Ban » </red><yellow>{player}</yellow><green> has been unbanned <aqua>· Source: <white>{operator}"
  unbanip: "<red>Ban » </red><yellow>{player}</yellow><green> has been IP-unbanned <aqua>· Source: <white>{operator}"
  unmute: "<gold>Mute » </gold><yellow>{player}</yellow><green> has been unmuted <aqua>· Source: <white>{operator}"

warn:
  auto-reason: "Reached {count} warnings"

error:
  usage: "<prefix><red>Usage: <white>{usage}"
  player-not-found: "<prefix><red>Player <white>{player}</white> not found."
  no-ip: "<prefix><red>Cannot determine the IP of <white>{player}</white>."
  not-online: "<prefix><red>Player <white>{player}</white> is not online."
  exempt: "<prefix><red>{player} is exempt from punishments."
  self: "<prefix><red>You cannot punish yourself."
  invalid-duration: "<prefix><red>Invalid duration <white>{input}</white>. Examples: 30m, 12h, 7d, 1mo, perm"
  duration-limit: "<prefix><red>You may only set durations up to <white>{max}</white>."
  no-silent: "<prefix><red>You are not allowed to use -s."
  not-banned: "<prefix><red>{player} is not banned."
  not-ipbanned: "<prefix><red>IP {ip} is not banned."
  not-muted: "<prefix><red>{player} is not muted."
  no-warns: "<prefix><red>{player} has no active warnings."
  no-permission: "<prefix><red>You don't have permission."
  database: "<prefix><red>Database query failed, see console."

notice:
  replaced: "<prefix><yellow>{player} already has an active punishment of this type; it will be replaced."

command:
  done: "<prefix><green>{type} applied: <white>{player}</white> <white>(#{id})"
  unwarned: "<prefix><green>Removed {count} warning(s) from {player}, {remaining} left."
  reloaded: "<prefix><green>Ban configuration reloaded."

command-desc:
  ban: "Ban a player"
  tempban: "Temporarily ban a player"
  ipban: "Ban an IP"
  tempipban: "Temporarily ban an IP"
  mute: "Mute a player"
  tempmute: "Temporarily mute a player"
  warn: "Warn a player"
  kick: "Kick a player"
  unban: "Unban a player"
  unbanip: "Unban an IP"
  unmute: "Unmute a player"
  unwarn: "Remove warnings"
  history: "Show punishment history"
  banlist: "List active bans"
  checkban: "Check punishment status"
  reload: "Reload ban configuration"

history:
  empty: "<prefix><white>{player} has no punishments."
  header: "<prefix><aqua>Punishments of {player} <white>(page {page}/{pages}, {total} total)"
  entry: "<white>#{id} <white>{type}</white> | {date} | <white>{reason}</white> | {operator} | expires {expires} {state}"

banlist:
  empty: "<prefix><white>No active bans."
  header: "<prefix><aqua>Active bans <white>(page {page}/{pages}, {total} total)"
  entry: "<white>#{id} <red>{player}</red> <white>{type}</white> | {reason} | <yellow>{remaining}</yellow> left"

check:
  header: "<prefix><aqua>{player} <white>status (IP: {ip})"
  ban: "<white> - <red>{type}</red> #{id}: <white>{reason}</white> by {operator}, <yellow>{remaining}</yellow> left"
  ipban: "<white> - <red>{type}</red> #{id}: <white>{reason}</white> by {operator}, <yellow>{remaining}</yellow> left"
  mute: "<white> - <gold>{type}</gold> #{id}: <white>{reason}</white> by {operator}, <yellow>{remaining}</yellow> left"
  clean: "<white> - <green>No active ban or mute"
  warns: "<white> - Active warnings: <yellow>{count}</yellow>"
