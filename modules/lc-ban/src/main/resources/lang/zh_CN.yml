# 处罚系统语言文件（MiniMessage）
prefix: "<aqua>处罚 » </aqua>"
# 常用占位符：{id} {player} {ip} {reason} {operator} {type} {date} {expires} {remaining} {duration} {appeal} {server}

words:
  permanent: "永久"
  active: "<green>生效中"
  revoked: "<white>已撤销（{operator}）"
  inactive: "<aqua>已失效"

types:
  ban: "封禁"
  ban-temp: "临时封禁"
  ipban: "IP 封禁"
  ipban-temp: "临时 IP 封禁"
  mute: "禁言"
  mute-temp: "临时禁言"
  warn: "警告"
  kick: "踢出"

operators:
  console: "控制台"
  anticheat: "反作弊"
  warning-ladder: "{operator} · 自动处罚"

anticheat-reasons:
  timer: "客户端计时异常"
  ground: "落地状态异常"
  fall: "下落状态异常"
  movement: "移动校验异常"
  knockback: "击退响应异常"
  order: "操作顺序异常"
  packets: "数据包异常"
  reach: "攻击距离异常"
  hitbox: "攻击判定异常"
  vehicle: "载具移动异常"
  slowdown: "移动减速异常"
  sprint: "疾跑状态异常"
  actions: "同时执行不兼容操作"
  place: "方块放置异常"
  break: "方块破坏异常"
  pathfinding: "自动寻路异常"
  elytra: "鞘翅飞行异常"
  chat: "聊天行为异常"
  exploit: "非法交互"
  interaction: "交互行为异常"
  aim: "瞄准行为异常"
  clicks: "点击频率异常"
  other: "检测到异常行为"

# 被拒绝登录 / 被踢出时显示的界面（可写成列表表示多行）
screen:
  ban:
    - "<gradient:#7ec8ff:#b98cff><bold>{server}</bold></gradient>"
    - ""
    - "<red><bold>你已被永久封禁</bold>"
    - ""
    - "<white>原因：<white>{reason}"
    - "<white>执行者：<white>{operator}"
    - "<white>封禁时间：<white>{date}"
    - "<white>处罚编号：<white>#{id}"
    - ""
    - "<white>申诉：<aqua>{appeal}"
  tempban:
    - "<gradient:#7ec8ff:#b98cff><bold>{server}</bold></gradient>"
    - ""
    - "<red><bold>你已被临时封禁</bold>"
    - ""
    - "<white>原因：<white>{reason}"
    - "<white>执行者：<white>{operator}"
    - "<white>到期时间：<white>{expires}"
    - "<white>剩余时间：<yellow>{remaining}"
    - "<white>处罚编号：<white>#{id}"
    - ""
    - "<white>申诉：<aqua>{appeal}"
  ipban:
    - "<gradient:#7ec8ff:#b98cff><bold>{server}</bold></gradient>"
    - ""
    - "<red><bold>你的 IP 已被永久封禁</bold>"
    - ""
    - "<white>原因：<white>{reason}"
    - "<white>执行者：<white>{operator}"
    - "<white>处罚编号：<white>#{id}"
    - ""
    - "<white>申诉：<aqua>{appeal}"
  tempipban:
    - "<gradient:#7ec8ff:#b98cff><bold>{server}</bold></gradient>"
    - ""
    - "<red><bold>你的 IP 已被临时封禁</bold>"
    - ""
    - "<white>原因：<white>{reason}"
    - "<white>到期时间：<white>{expires}"
    - "<white>剩余时间：<yellow>{remaining}"
    - "<white>处罚编号：<white>#{id}"
    - ""
    - "<white>申诉：<aqua>{appeal}"
  kick:
    - "<gradient:#7ec8ff:#b98cff><bold>{server}</bold></gradient>"
    - ""
    - "<yellow><bold>你已被踢出服务器</bold>"
    - ""
    - "<white>原因：<white>{reason}"
    - "<white>执行者：<white>{operator}"

notify:
  muted:
    - "<gold>禁言 » </gold><white>你已被永久禁言"
    - "<aqua>原因：<white>{reason}</white> · 来源：<white>{operator}"
  tempmuted:
    - "<gold>禁言 » </gold><white>你已被禁言 <yellow>{duration}</yellow>"
    - "<aqua>原因：<white>{reason}</white> · 来源：<white>{operator}"
  warned:
    - "<gold>警告 » </gold><white>你收到一次警告（累计 <yellow>{count}</yellow> 次）"
    - "<aqua>原因：<white>{reason}</white> · 来源：<white>{operator}"
  unmuted: "<gold>禁言 » </gold><green>你的禁言已解除"
  muted-chat:
    - "<gold>禁言 » </gold><white>你处于禁言状态，剩余 <yellow>{remaining}</yellow>"
    - "<aqua>原因：<white>{reason}"
  muted-command: "<gold>禁言 » </gold><white>禁言期间无法使用该命令，剩余 <yellow>{remaining}</yellow>"

broadcast:
  ban:
    - "<red>封禁 » </red><yellow>{player}</yellow><white> 已被永久封禁"
    - "<aqua>原因：<white>{reason}</white> · 来源：<white>{operator}"
  ban-temp:
    - "<red>封禁 » </red><yellow>{player}</yellow><white> 已被封禁 <yellow>{duration}</yellow>"
    - "<aqua>原因：<white>{reason}</white> · 来源：<white>{operator}"
  ipban:
    - "<red>封禁 » </red><yellow>{player}</yellow><white> 已被永久 IP 封禁"
    - "<aqua>原因：<white>{reason}</white> · 来源：<white>{operator}"
  ipban-temp:
    - "<red>封禁 » </red><yellow>{player}</yellow><white> 已被 IP 封禁 <yellow>{duration}</yellow>"
    - "<aqua>原因：<white>{reason}</white> · 来源：<white>{operator}"
  mute:
    - "<gold>禁言 » </gold><yellow>{player}</yellow><white> 已被永久禁言"
    - "<aqua>原因：<white>{reason}</white> · 来源：<white>{operator}"
  mute-temp:
    - "<gold>禁言 » </gold><yellow>{player}</yellow><white> 已被禁言 <yellow>{duration}</yellow>"
    - "<aqua>原因：<white>{reason}</white> · 来源：<white>{operator}"
  warn:
    - "<gold>警告 » </gold><yellow>{player}</yellow><white> 收到一次警告（累计 <yellow>{count}</yellow> 次）"
    - "<aqua>原因：<white>{reason}</white> · 来源：<white>{operator}"
  kick:
    - "<yellow>踢出 » {player}</yellow><white> 已被踢出服务器"
    - "<aqua>原因：<white>{reason}</white> · 来源：<white>{operator}"
  silent-prefix: "<aqua>[静默]</aqua> {message}"
  unban: "<red>封禁 » </red><yellow>{player}</yellow><green> 的封禁已解除 <aqua>· 来源：<white>{operator}"
  unbanip: "<red>封禁 » </red><yellow>{player}</yellow><green> 的 IP 封禁已解除 <aqua>· 来源：<white>{operator}"
  unmute: "<gold>禁言 » </gold><yellow>{player}</yellow><green> 的禁言已解除 <aqua>· 来源：<white>{operator}"

warn:
  auto-reason: "警告次数达到 {count} 次"

error:
  usage: "<prefix><red>用法：<white>{usage}"
  player-not-found: "<prefix><red>找不到玩家 <white>{player}</white>（该玩家从未进入过服务器）。"
  no-ip: "<prefix><red>无法获取 <white>{player}</white> 的 IP 地址。"
  not-online: "<prefix><red>玩家 <white>{player}</white> 不在线。"
  exempt: "<prefix><red>{player} 拥有处罚豁免权限。"
  self: "<prefix><red>你不能处罚自己。"
  invalid-duration: "<prefix><red>无法解析时长 <white>{input}</white>，示例：30m、12h、7d、1mo、perm"
  duration-limit: "<prefix><red>你最多只能设置 <white>{max}</white> 的时长。"
  no-silent: "<prefix><red>你没有使用 -s 静默处罚的权限。"
  not-banned: "<prefix><red>{player} 当前没有被封禁。"
  not-ipbanned: "<prefix><red>IP {ip} 当前没有被封禁。"
  not-muted: "<prefix><red>{player} 当前没有被禁言。"
  no-warns: "<prefix><red>{player} 没有有效的警告。"
  no-permission: "<prefix><red>你没有权限这样做。"
  database: "<prefix><red>查询数据库失败，请查看控制台。"

notice:
  replaced: "<prefix><yellow>{player} 已有同类型处罚，旧处罚将被覆盖。"

command:
  done: "<prefix><green>已执行 {type}：<white>{player}</white> <white>(#{id})"
  unwarned: "<prefix><green>已撤销 {player} 的 {count} 条警告，剩余 {remaining} 条。"
  reloaded: "<prefix><green>封禁配置已重载。"

command-desc:
  ban: "永久封禁玩家"
  tempban: "临时封禁玩家"
  ipban: "永久封禁 IP"
  tempipban: "临时封禁 IP"
  mute: "永久禁言玩家"
  tempmute: "临时禁言玩家"
  warn: "警告玩家"
  kick: "踢出玩家"
  unban: "解除封禁"
  unbanip: "解除 IP 封禁"
  unmute: "解除禁言"
  unwarn: "撤销警告"
  history: "查看处罚历史"
  banlist: "查看封禁列表"
  checkban: "查询玩家封禁状态"
  reload: "重载封禁配置"

history:
  empty: "<prefix><white>{player} 没有任何处罚记录。"
  header: "<prefix><aqua>{player} 的处罚记录 <white>（第 {page}/{pages} 页，共 {total} 条）"
  entry: "<white>#{id} <white>{type}</white> <aqua>|</aqua> {date} <aqua>|</aqua> <white>{reason}</white> <aqua>|</aqua> {operator} <aqua>|</aqua> 到期 {expires} {state}"

banlist:
  empty: "<prefix><white>当前没有生效的封禁。"
  header: "<prefix><aqua>生效中的封禁 <white>（第 {page}/{pages} 页，共 {total} 条）"
  entry: "<white>#{id} <red>{player}</red> <white>{type}</white> <aqua>|</aqua> {reason} <aqua>|</aqua> 剩余 <yellow>{remaining}"

check:
  header: "<prefix><aqua>{player} <white>的处罚状态（IP：{ip}）"
  ban: "<white> - <red>{type}</red> #{id}：<white>{reason}</white>，执行者 {operator}，剩余 <yellow>{remaining}"
  ipban: "<white> - <red>{type}</red> #{id}：<white>{reason}</white>，执行者 {operator}，剩余 <yellow>{remaining}"
  mute: "<white> - <gold>{type}</gold> #{id}：<white>{reason}</white>，执行者 {operator}，剩余 <yellow>{remaining}"
  clean: "<white> - <green>没有生效中的封禁或禁言"
  warns: "<white> - 有效警告：<yellow>{count}</yellow> 次"
