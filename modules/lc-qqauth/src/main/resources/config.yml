# QQAuth transport and account authentication settings.
integration:
  mode: astrbot # astrbot | onebot | disabled
  group-id: "REPLACE_WITH_QQ_GROUP_ID" # Exact group id; '*' disables group filtering and trusts the authenticated bridge.
  astrbot:
    bind-address: "127.0.0.1"
    port: 12312
    token: "CHANGE_THIS_LONG_RANDOM_TOKEN"
  onebot:
    endpoint: "ws://127.0.0.1:3001"
    token: ""
    reconnect-seconds: 5
binding:
  required: true
  reminder:
    enabled: true
    timezone: "" # Empty uses the server timezone.
  code-length: 6
  bind-ttl-seconds: 600
  unbind-ttl-seconds: 600
  reset-ttl-seconds: 300
  max-pending-codes: 10000
  max-per-qq: 1
  per-qq-limits: {}
auth:
  enabled: true
  identity-mode: auto # auto follows online-mode; uuid always requires a UUID match; name permits password-verified UUID migration.
  # New and existing players must register/login in-game; no AuthMe password hashes are imported.
  min-password-length: 10
  max-password-length: 64
  bcrypt-cost: 12
  max-attempts: 8
  attempt-window-seconds: 300
  max-attempt-entries: 20000
  max-accounts-per-ip: 3
  sessions:
    enabled: false
    ttl-seconds: 86400
    max-sessions: 100000
  restrictions:
    # Only extra commands go here. login/register/recovery are handled directly.
    # Do not add privileged or gameplay commands; their permissions alone do not prove identity.
    allow-commands: [qqauth, qqauthreset, help]
    # Chat, movement, interactions, damage, items and inventory stay blocked until login.

# 所有玩家、管理员、QQ群与 Web 提示。支持 YAML 多行文本或字符串列表。
