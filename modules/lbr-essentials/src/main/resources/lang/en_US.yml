# Essentials module language file (MiniMessage). {xxx} are placeholders.
usage: "<red>Usage: <yellow>{usage}"
player-only: "<red>Only players can use this command."
player-not-found: "<red>Online player <yellow>{player}</yellow> not found."
no-permission-others: "<red>You don't have permission to do this to other players."
no-permission-sub: "<red>You don't have permission to use <yellow>{sub}</yellow>."
invalid-number: "<red>Invalid number: <yellow>{value}"
invalid-item: "<red>Unknown item: <yellow>{item}"
world-not-found: "<red>World not found: <yellow>{world}"
hand-empty: "<red>You are not holding anything."
data-loading: "<red>Your data is still loading, please try again shortly."

state:
  on: "<green>enabled</green>"
  off: "<red>disabled</red>"

gamemode:
  set: "<gray>Set <aqua>{player}</aqua>'s game mode to <gold>{mode}</gold>."
  notify: "<gray>Your game mode was set to <gold>{mode}</gold>."
  no-mode-permission: "<red>You don't have permission to switch to {mode}."
  names:
    survival: "Survival"
    creative: "Creative"
    adventure: "Adventure"
    spectator: "Spectator"

fly:
  set: "<gray>Flight for <aqua>{player}</aqua>: {state}"
  notify: "<gray>Your flight: {state}"
god:
  set: "<gray>God mode for <aqua>{player}</aqua>: {state}"
  notify: "<gray>Your god mode: {state}"
heal:
  done: "<green>Healed <aqua>{player}</aqua>."
  notify: "<green>You have been healed."
feed:
  done: "<green>Fed <aqua>{player}</aqua>."
  notify: "<green>Your hunger has been satisfied."
speed:
  set: "<gray>Set <aqua>{player}</aqua>'s {type} speed to <gold>{speed}</gold>."
  notify: "<gray>Your {type} speed was set to <gold>{speed}</gold>."
  range: "<red>Speed must be between 0 and {max}."
  type-walk: "walk"
  type-fly: "fly"
afk:
  broadcast-on: "<gray>* <yellow>{player}</yellow> is now AFK."
  broadcast-off: "<gray>* <yellow>{player}</yellow> is no longer AFK."
  self-on: "<gray>You are now AFK."
  self-off: "<gray>You are no longer AFK."
  kick: "<red>You were kicked for being AFK too long."
vanish:
  set: "<gray>Vanish for <aqua>{player}</aqua>: {state}"
  notify: "<gray>Your vanish: {state}"
  fake-join: "<yellow>{player} joined the game"
  fake-quit: "<yellow>{player} left the game"
kill:
  done: "<gray>Killed <aqua>{player}</aqua>."
  exempt: "<red>{player} cannot be killed."
suicide:
  done: "<gray>Goodbye, cruel world..."
burn:
  done: "<gray>Set <aqua>{player}</aqua> on fire for {seconds} seconds."
ext:
  done: "<gray>Extinguished <aqua>{player}</aqua>."
lightning:
  done: "<gray>Lightning struck <aqua>{target}</aqua>!"
invsee:
  self: "<red>You cannot invsee yourself."
  open: "<gray>Viewing <aqua>{player}</aqua>'s inventory (editable)."
  open-readonly: "<gray>Viewing <aqua>{player}</aqua>'s inventory (read-only)."
clear:
  done: "<gray>Cleared <aqua>{player}</aqua>'s inventory."
  notify: "<gray>Your inventory has been cleared."
exp:
  show: "<aqua>{player}</aqua> <gray>level <gold>{level}</gold>, total exp <gold>{total}</gold>."
  done: "<gray>Updated <aqua>{player}</aqua>'s exp: level <gold>{level}</gold>, total <gold>{total}</gold>."
ping: "<aqua>{player}</aqua><gray>'s ping: <gold>{ping}ms"
getpos: "<aqua>{player}</aqua> <gray>is in <gold>{world}</gold> <white>X:{x} Y:{y} Z:{z}</white> <dark_gray>(yaw {yaw}, pitch {pitch})"
depth:
  above: "<gray>You are <gold>{blocks}</gold> blocks above sea level."
  below: "<gray>You are <gold>{blocks}</gold> blocks below sea level."
  at: "<gray>You are at sea level."
compass: "<gray>You are facing <gold>{direction}</gold> <dark_gray>({yaw}°)"
compass-dir:
  N: "North"
  NE: "North-East"
  E: "East"
  SE: "South-East"
  S: "South"
  SW: "South-West"
  W: "West"
  NW: "North-West"
near:
  list: "<gray>Players within {radius} blocks: <white>{players}"
  none: "<gray>No other players within {radius} blocks."
jump:
  done: "<gray>Whoosh!"
  no-block: "<red>No block in sight."
sudo:
  done: "<gray>Forced <aqua>{player}</aqua> to run: <white>{command}"
  exempt: "<red>You cannot sudo {player}."

give:
  done: "<gray>Gave <aqua>{player}</aqua> <gold>{amount}</gold> x <yellow>{item}</yellow>."
  received: "<gray>You received <gold>{amount}</gold> x <yellow>{item}</yellow>."
  blacklisted: "<red>Item {item} is blacklisted."
more:
  done: "<gray>Stack filled to <gold>{amount}</gold>."
repair:
  hand: "<green>Repaired <yellow>{item}</yellow>."
  all: "<green>Repaired <gold>{count}</gold> items."
  cannot: "<red>This item cannot be repaired or is not damaged."
enchant:
  list: "<gray>Enchantments: <white>{list}"
  unknown: "<red>Unknown enchantment: {name}"
  done: "<gray>Applied <light_purple>{enchant} {level}</light_purple>."
  removed: "<gray>Removed <light_purple>{enchant}</light_purple>."
  unsafe: "<red>This enchantment can't be applied to this item or exceeds level {max}."
  too-high: "<red>Enchantment level cannot exceed {max}."
hat:
  done: "<gray>Enjoy your new hat!"
  removed: "<gray>Hat removed."
  none: "<red>You are not wearing a hat."
skull:
  done: "<gray>You received <yellow>{name}</yellow>'s head."
  invalid: "<red>Invalid player name: {name}"
itemname:
  done: "<gray>Item renamed."
  reset: "<gray>Item name reset."
lore:
  done: "<gray>Lore updated."
  bad-line: "<red>Invalid line number (current lines: {max})."
book:
  unlocked: "<gray>The book is now editable."
  locked: "<gray>Signed book <yellow>{title}</yellow>."
  author: "<gray>Author changed to <yellow>{author}</yellow>."
  title: "<gray>Title changed."
  not-owner: "<red>You did not write this book."
  not-book: "<red>Hold a written book or a book and quill."
condense:
  done: "<gray>Condensed into <gold>{count}</gold> items."
  none: "<gray>Nothing to condense."
unbreakable: "<gray>Unbreakable: {state}"
powertool:
  set: "<gray>Bound <yellow>{item}</yellow> to: <white>{command}"
  list: "<yellow>{item}</yellow> <gray>commands: <white>{commands}"
  empty: "<gray>This item has no bound commands."
  cleared: "<gray>Cleared commands of <yellow>{item}</yellow>."
  cleared-all: "<gray>Cleared all power tools."
disposal:
  title: "<dark_gray>Disposal (cleared on close)"
worth:
  show: "<yellow>{item}</yellow> <gray>is worth <gold>{price}</gold> each, {amount} for <gold>{total}</gold>."
  none: "<red>{item} has no price."
  set: "<gray>Set <yellow>{item}</yellow> price to <gold>{price}</gold>."
sell:
  done: "<green>Sold <gold>{count}</gold> items for <gold>{money}</gold>."
  cannot: "<red>Nothing to sell."
  failed: "<red>Sale failed: {error}"
  no-economy: "<red>Economy is unavailable."
  creative: "<red>You cannot sell items in creative or spectator mode."

time:
  show: "<gray>Time in <gold>{world}</gold>: <yellow>{time}</yellow> <dark_gray>({ticks} ticks)"
  set: "<gray>Set time in <gold>{world}</gold> to <yellow>{time}</yellow>."
  added: "<gray>Added <yellow>{time}</yellow> ticks to <gold>{world}</gold>."
  invalid: "<red>Invalid time: {value}"
weather:
  set: "<gray>Set weather in <gold>{world}</gold> to <yellow>{weather}</yellow>."
  names:
    sun: "clear"
    rain: "rain"
    storm: "thunderstorm"
ptime:
  set: "<gray>Set <aqua>{player}</aqua>'s time to <yellow>{time}</yellow>."
  reset: "<gray>Reset <aqua>{player}</aqua>'s time."
pweather:
  set: "<gray>Set <aqua>{player}</aqua>'s weather to <yellow>{weather}</yellow>."
  reset: "<gray>Reset <aqua>{player}</aqua>'s weather."
spawnmob:
  done: "<gray>Spawned <gold>{count}</gold> x <yellow>{mob}</yellow>."
  unknown: "<red>Unknown or unspawnable mob: {mob}"
  blacklisted: "<red>Mob {mob} is blacklisted."
butcher:
  done: "<gray>Removed <gold>{count}</gold> entities ({type})."
tree:
  done: "<gray>Tree generated ({type})."
  failed: "<red>Cannot generate a tree here."
  unknown: "<red>Unknown tree type: {type}"
recipe:
  none: "<red>{item} has no displayable recipe."
  title: "<dark_aqua>Recipe: {item} <dark_gray>({page}/{pages})"
  arrow: "<gray>→"
  prev: "<yellow>Previous recipe <gray>({page}/{pages})"
  next: "<yellow>Next recipe <gray>({page}/{pages})"
  options: "<gray>Any of {count} items"
  fuel: "<gray>Cooks in {time}s, {exp} exp"
  type:
    crafting: "<gold>Shaped crafting"
    shapeless: "<gold>Shapeless crafting"
    furnace: "<gold>Furnace"
    blasting: "<gold>Blast furnace"
    smoking: "<gold>Smoker"
    campfire: "<gold>Campfire"
    stonecutting: "<gold>Stonecutter"
    smithing: "<gold>Smithing table"
    other: "<gold>Other"

seen:
  online: "<aqua>{player}</aqua> is <green>online</green><gray> for <yellow>{time}</yellow>."
  offline: "<aqua>{player}</aqua> is <red>offline</red><gray>, last seen <yellow>{time}</yellow> ago <dark_gray>({date})"
  never: "<red>{player} has never joined."
  ip: "<gray>Last IP: <white>{ip}"
whois:
  header: "<gold>======== <yellow>{player}</yellow> ========"
  uuid: "<gray>UUID: <white>{uuid}"
  health: "<gray>Health: <red>{health}</red>  Food: <gold>{food}"
  exp: "<gray>Level: <green>{level}</green>  Total exp: <green>{total}"
  location: "<gray>Location: <white>{world} {x}, {y}, {z}"
  gamemode: "<gray>Game mode: <white>{mode}"
  states: "<gray>God: {god}  Fly: {fly}  AFK: {afk}  Vanish: {vanish}  OP: {op}"
  ping: "<gray>Ping: <white>{ping}ms"
  ip: "<gray>IP: <white>{ip}"
  offline: "<gray>Status: <red>offline</red>, last seen <white>{date}"
  times: "<gray>First join: <white>{first}</white>  Playtime: <white>{playtime}"
list:
  header: "<gray>There are <gold>{count}</gold>/<gold>{max}</gold> players online:"
  group: "<yellow>{group}</yellow> <dark_gray>({count})</dark_gray><gray>: <white>{players}"
  default-group: "Players"
  afk-tag: "<gray>[AFK]</gray>"
  vanish-tag: "<dark_gray>[V]</dark_gray>"
gc:
  uptime: "<gray>Uptime: <white>{time}"
  tps: "<gray>TPS (1m, 5m, 15m): {tps}"
  mspt: "<gray>Average tick time: <white>{mspt} ms"
  memory: "<gray>Memory: <white>{used}MB</white> used / <white>{allocated}MB</white> allocated / <white>{max}MB</white> max"
  world: "<gray> - <gold>{world}</gold> <dark_gray>({env})</dark_gray>: chunks <white>{chunks}</white>, entities <white>{entities}</white>, players <white>{players}</white>"

kit:
  received: "<green>You received kit <yellow>{kit}</yellow>!"
  given: "<gray>Gave kit <yellow>{kit}</yellow> to <aqua>{player}</aqua>."
  not-found: "<red>Kit {kit} does not exist."
  no-permission: "<red>You don't have permission for kit {kit}."
  already: "<red>Kit {kit} can only be claimed once."
  cooldown: "<red>Kit {kit} is on cooldown for <yellow>{time}</yellow>."
  list: "<gray>Kits: <white>{kits}"
  list-empty: "<gray>No kits available."
  created: "<green>Created kit <yellow>{kit}</yellow> ({count} items, cooldown {cooldown})."
  updated: "<green>Updated kit <yellow>{kit}</yellow> ({count} items, cooldown {cooldown})."
  deleted: "<gray>Deleted kit <yellow>{kit}</yellow>."
  invalid-name: "<red>Kit names may only contain letters, digits, _ and - (max 32)."
  invalid-cooldown: "<red>Invalid cooldown: {value} (e.g. 1d, 12h, 30m)"
  empty-inventory: "<red>Your inventory is empty."
  no-cooldown: "none"
  gui-title: "<dark_aqua>Kits"
  preview-title: "<dark_aqua>Kit preview: {kit}"
  gui-available: "<green>Available"
  gui-claimed: "<red>Claimed (one-time)"
  gui-cooldown: "<red>Cooldown: {time}"
  gui-items: "<gray>{count} items"
  gui-hint: "<dark_gray>Left-click to claim · Right-click to preview"
