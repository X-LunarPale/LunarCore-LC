# 封禁系统语言文件（MiniMessage）
prefix: "<dark_gray>[</dark_gray><dark_red><bold>封禁</bold></dark_red><dark_gray>]</dark_gray> "
# 常用占位符：{id} {player} {ip} {reason} {operator} {type} {date} {expires} {remaining} {duration} {appeal} {server}

words:
  permanent: "永久"
  active: "<green>生效中"
  revoked: "<gray>已撤销（{operator}）"
  inactive: "<dark_gray>已失效"

types:
  ban: "封禁"
  ban-temp: "临时封禁"
  ipban: "IP 封禁"
  ipban-temp: "临时 IP 封禁"
  mute: "禁言"
  mute-temp: "临时禁言"
  warn: "警告"
  kick: "踢出"

# 被拒绝登录 / 被踢出时显示的界面（可写成列表表示多行）
screen:
  ban:
    - "<gradient:#7ec8ff:#b98cff><bold>Lunar Boreal</bold></gradient>"
    - ""
    - "<red><bold>你已被永久封禁</bold>"
    - ""
    - "<gray>原因：<white>{reason}"
    - "<gray>执行者：<white>{operator}"
    - "<gray>封禁时间：<white>{date}"
    - "<gray>处罚编号：<white>#{id}"
    - ""
    - "<gray>申诉：<aqua>{appeal}"
  tempban:
    - "<gradient:#7ec8ff:#b98cff><bold>Lunar Boreal</bold></gradient>"
    - ""
    - "<red><bold>你已被临时封禁</bold>"
    - ""
    - "<gray>原因：<white>{reason}"
    - "<gray>执行者：<white>{operator}"
    - "<gray>到期时间：<white>{expires}"
    - "<gray>剩余时间：<yellow>{remaining}"
    - "<gray>处罚编号：<white>#{id}"
    - ""
    - "<gray>申诉：<aqua>{appeal}"
  ipban:
    - "<gradient:#7ec8ff:#b98cff><bold>Lunar Boreal</bold></gradient>"
    - ""
    - "<red><bold>你的 IP 已被永久封禁</bold>"
    - ""
    - "<gray>原因：<white>{reason}"
    - "<gray>执行者：<white>{operator}"
    - "<gray>处罚编号：<white>#{id}"
    - ""
    - "<gray>申诉：<aqua>{appeal}"
  tempipban:
    - "<gradient:#7ec8ff:#b98cff><bold>Lunar Boreal</bold></gradient>"
    - ""
    - "<red><bold>你的 IP 已被临时封禁</bold>"
    - ""
    - "<gray>原因：<white>{reason}"
    - "<gray>到期时间：<white>{expires}"
    - "<gray>剩余时间：<yellow>{remaining}"
    - "<gray>处罚编号：<white>#{id}"
    - ""
    - "<gray>申诉：<aqua>{appeal}"
  kick:
    - "<gradient:#7ec8ff:#b98cff><bold>Lunar Boreal</bold></gradient>"
    - ""
    - "<yellow><bold>你已被踢出服务器</bold>"
    - ""
    - "<gray>原因：<white>{reason}"
    - "<gray>执行者：<white>{operator}"

notify:
  muted: "<prefix><red>你已被永久禁言。<gray>原因：<white>{reason}"
  tempmuted: "<prefix><red>你已被禁言 <yellow>{duration}</yellow>。<gray>原因：<white>{reason}"
  warned: "<prefix><gold>你收到一次警告（当前 {count} 次）。<gray>原因：<white>{reason}"
  unmuted: "<prefix><green>你的禁言已被解除。"
  muted-chat: "<prefix><red>你正处于禁言状态，剩余 <yellow>{remaining}</yellow>。<gray>原因：<white>{reason}"
  muted-command: "<prefix><red>禁言期间无法使用该命令，剩余 <yellow>{remaining}</yellow>。"

broadcast:
  ban: "<prefix><red>{player}</red> <gray>被 <white>{operator}</white> 永久封禁。原因：<white>{reason}"
  ban-temp: "<prefix><red>{player}</red> <gray>被 <white>{operator}</white> 封禁 <yellow>{duration}</yellow>。原因：<white>{reason}"
  ipban: "<prefix><red>{player}</red> <gray>被 <white>{operator}</white> 永久 IP 封禁。原因：<white>{reason}"
  ipban-temp: "<prefix><red>{player}</red> <gray>被 <white>{operator}</white> IP 封禁 <yellow>{duration}</yellow>。原因：<white>{reason}"
  mute: "<prefix><gold>{player}</gold> <gray>被 <white>{operator}</white> 永久禁言。原因：<white>{reason}"
  mute-temp: "<prefix><gold>{player}</gold> <gray>被 <white>{operator}</white> 禁言 <yellow>{duration}</yellow>。原因：<white>{reason}"
  warn: "<prefix><yellow>{player}</yellow> <gray>被 <white>{operator}</white> 警告。原因：<white>{reason}"
  kick: "<prefix><yellow>{player}</yellow> <gray>被 <white>{operator}</white> 踢出服务器。原因：<white>{reason}"
  silent-prefix: "<dark_gray>[静默]</dark_gray> {message}"
  unban: "<prefix><green>{player}</green> <gray>已被 <white>{operator}</white> 解除封禁。"
  unbanip: "<prefix><green>{player}</green> <gray>的 IP 封禁已被 <white>{operator}</white> 解除。"
  unmute: "<prefix><green>{player}</green> <gray>已被 <white>{operator}</white> 解除禁言。"

warn:
  auto-reason: "警告次数达到 {count} 次"

error:
  usage: "<prefix><red>用法：<white>{usage}"
  player-not-found: "<prefix><red>找不到玩家 <white>{player}</white>（该玩家从未进入过服务器）。"
  no-ip: "<prefix><red>无法获取 <white>{player}</white> 的 IP 地址。"
  not-online: "<prefix><red>玩家 <white>{player}</white> 不在线。"
  exempt: "<prefix><red>{player} 拥有处罚豁免权限。"
  self: "<prefix><red>你不能处罚自己。"
  invalid-duration: "<prefix><red>无法解析时长 <white>{input}</white>，示例：30m、12h、7d、1mo、perm"
  duration-limit: "<prefix><red>你最多只能设置 <white>{max}</white> 的时长。"
  no-silent: "<prefix><red>你没有使用 -s 静默处罚的权限。"
  not-banned: "<prefix><red>{player} 当前没有被封禁。"
  not-ipbanned: "<prefix><red>IP {ip} 当前没有被封禁。"
  not-muted: "<prefix><red>{player} 当前没有被禁言。"
  no-warns: "<prefix><red>{player} 没有有效的警告。"
  no-permission: "<prefix><red>你没有权限这样做。"
  database: "<prefix><red>查询数据库失败，请查看控制台。"

notice:
  replaced: "<prefix><yellow>{player} 已有同类型处罚，旧处罚将被覆盖。"

command:
  done: "<prefix><green>已执行 {type}：<white>{player}</white> <gray>(#{id})"
  unwarned: "<prefix><green>已撤销 {player} 的 {count} 条警告，剩余 {remaining} 条。"
  reloaded: "<prefix><green>封禁配置已重载。"

command-desc:
  ban: "永久封禁玩家"
  tempban: "临时封禁玩家"
  ipban: "永久封禁 IP"
  tempipban: "临时封禁 IP"
  mute: "永久禁言玩家"
  tempmute: "临时禁言玩家"
  warn: "警告玩家"
  kick: "踢出玩家"
  unban: "解除封禁"
  unbanip: "解除 IP 封禁"
  unmute: "解除禁言"
  unwarn: "撤销警告"
  history: "查看处罚历史"
  banlist: "查看封禁列表"
  checkban: "查询玩家封禁状态"
  reload: "重载封禁配置"

history:
  empty: "<prefix><gray>{player} 没有任何处罚记录。"
  header: "<prefix><aqua>{player} 的处罚记录 <gray>（第 {page}/{pages} 页，共 {total} 条）"
  entry: "<gray>#{id} <white>{type}</white> <dark_gray>|</dark_gray> {date} <dark_gray>|</dark_gray> <white>{reason}</white> <dark_gray>|</dark_gray> {operator} <dark_gray>|</dark_gray> 到期 {expires} {state}"

banlist:
  empty: "<prefix><gray>当前没有生效的封禁。"
  header: "<prefix><aqua>生效中的封禁 <gray>（第 {page}/{pages} 页，共 {total} 条）"
  entry: "<gray>#{id} <red>{player}</red> <white>{type}</white> <dark_gray>|</dark_gray> {reason} <dark_gray>|</dark_gray> 剩余 <yellow>{remaining}"

check:
  header: "<prefix><aqua>{player} <gray>的处罚状态（IP：{ip}）"
  ban: "<gray> - <red>{type}</red> #{id}：<white>{reason}</white>，执行者 {operator}，剩余 <yellow>{remaining}"
  ipban: "<gray> - <red>{type}</red> #{id}：<white>{reason}</white>，执行者 {operator}，剩余 <yellow>{remaining}"
  mute: "<gray> - <gold>{type}</gold> #{id}：<white>{reason}</white>，执行者 {operator}，剩余 <yellow>{remaining}"
  clean: "<gray> - <green>没有生效中的封禁或禁言"
  warns: "<gray> - 有效警告：<yellow>{count}</yellow> 次"
