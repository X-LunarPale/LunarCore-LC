name: LunarCore
version: '${version}'
main: com.lunarboreal.core.LunarCorePlugin
api-version: '26.3'
prefix: LunarCore
authors: [琉月]
description: LunarCore 琉月 · v${version} · 模块化服务器管理 · GPL-3.0-only
website: https://github.com/X-LunarPale/LunarCore-LC
load: STARTUP
softdepend: [Vault, PlaceholderAPI, LuckPerms, LagFixer, GrimAC]
loadbefore: [Essentials]
libraries:
  - io.javalin:javalin:6.7.0
  - com.zaxxer:HikariCP:7.1.0
  - org.xerial:sqlite-jdbc:3.53.4.0
  - com.mysql:mysql-connector-j:26.7.0
  - com.auth0:java-jwt:4.6.2
  - at.favre.lib:bcrypt:0.10.2
  - org.slf4j:slf4j-jdk14:2.0.17
commands:
  lc:
    description: LunarCore 琉月管理命令
    aliases: [lunarcore, lunarboreal, lunar]
    usage: /lc help
permissions:
  lc.admin:
    description: LC 核心管理权限（包含下列全部 /lc 子命令权限）
    default: op
    children:
      lc.info: true
      lc.reload: true
      lc.module: true
      lc.web: true
      lc.debug: true
  lc.info:
    description: /lc info 查看版本、数据库、模块与 Web 地址
    default: op
  lc.reload:
    description: /lc reload 重载核心与模块配置
    default: op
  lc.module:
    description: /lc module 启用/禁用/重载模块
    default: op
  lc.web:
    description: /lc web 管理 Web 面板（账号、重启等）
    default: op
  lc.debug:
    description: /lc debug 切换调试输出
    default: op
