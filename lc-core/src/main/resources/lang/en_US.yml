# ==========================================================
#   LunarCore 琉月 core messages
#   Format: MiniMessage, legacy & codes supported. <prefix> = global prefix, {name} = placeholder.
#   Lists are sent as multiple lines; empty string = do not send.
# ==========================================================

prefix: "<gradient:#7ec8ff:#b98cff><bold>LC</bold></gradient> <aqua>» "

word-yes: "<green>yes"
word-no: "<red>no"

no-permission: "<prefix><red>You don't have permission to do that. <aqua>({permission})"
player-only: "<prefix><red>This command can only be used by players."
command-error: "<prefix><red>An internal error occurred, please check the console."
unknown-subcommand: "<prefix><red>Unknown sub-command, type <yellow>/{label} help</yellow>."
player-not-found: "<prefix><red>Player <yellow>{player}</yellow> not found."
web-offline: "<red>offline"
web-usage: "<prefix><white>Usage: <yellow>/{label} web <sub-command></yellow>"

help:
  - "<gradient:#7ec8ff:#b98cff><bold>LunarCore 琉月</bold></gradient> <aqua>— Help"
  - "<yellow>/{label} info</yellow> <aqua>- <white>Version, platform, database and modules"
  - "<yellow>/{label} reload</yellow> <aqua>- <white>Reload core config, languages and module configs"
  - "<yellow>/{label} m list</yellow> <aqua>- <white>Show all module statuses"
  - "<yellow>/{label} module enable|disable|reload|info <module></yellow> <aqua>- <white>Manage modules"
  - "<yellow>/{label} web</yellow> <aqua>- <white>Web panel commands"
  - "<yellow>/{label} debug</yellow> <aqua>- <white>Toggle debug output"

info:
  - "<gradient:#7ec8ff:#b98cff><bold>LunarCore 琉月</bold></gradient> <white>v{version}"
  - "<aqua>Platform: <white>{platform}</white> <aqua>(Paper: {paper})"
  - "<aqua>Minecraft: <white>{minecraft}</white> <aqua>| Java: <white>{java}"
  - "<aqua>Database: <white>{database}</white> <aqua>| Language: <white>{language}"
  - "<aqua>Modules: <green>{modules}</green><aqua>/<white>{discovered}</white> <white>enabled"
  - "<aqua>PlaceholderAPI: {papi}"
  - "<aqua>Web panel: <white>{web}"

reload:
  done: "<prefix><green>Reloaded core config, languages and <yellow>{modules}</yellow> module configs. <aqua>({time}ms)"

debug:
  enabled: "<prefix><yellow>Debug mode enabled (this run only)."
  disabled: "<prefix><white>Debug mode disabled."

module:
  usage: "<prefix><white>Usage: <yellow>/{label} module <list|enable|disable|reload|info> [id]"
  list-header: "<prefix><white>Modules (<green>{count}</green>/<white>{total}</white> enabled):"
  list-entry: " <aqua>• <white>{name}</white> <white>({id}) <aqua>v{version} {status}"
  status:
    enabled: "<green>● enabled"
    failed: "<red>✖ failed"
    disabled: "<white>○ disabled in config"
    stopped: "<yellow>○ stopped"
  not-found: "<prefix><red>Module <yellow>{id}</yellow> not found in modules/."
  already-enabled: "<prefix><yellow>Module {id} is already enabled."
  not-enabled: "<prefix><yellow>Module {id} is not enabled."
  enabled: "<prefix><green>Module <yellow>{id}</yellow> enabled."
  enable-failed: "<prefix><red>Failed to enable module <yellow>{id}</yellow>: <white>{reason}"
  disabled: "<prefix><green>Module <yellow>{id}</yellow> disabled (until restart; add <white>--save</white> to persist)."
  disabled-saved: "<prefix><green>Module <yellow>{id}</yellow> disabled and saved to modules.disabled."
  reloaded: "<prefix><green>Module <yellow>{id}</yellow> reloaded."
  reload-failed: "<prefix><red>Failed to reload module <yellow>{id}</yellow>: <white>{reason}"
  info:
    - "<gradient:#7ec8ff:#b98cff>Module</gradient> <white>{name}</white> <white>({id})"
    - "<aqua>Version: <white>{version}</white> <aqua>| Status: {status}"
    - "<aqua>Description: <white>{description}"
    - "<aqua>Authors: <white>{authors}"
    - "<aqua>Depends: <white>{depends}</white> <aqua>| Soft: <white>{softdepends}"
    - "<aqua>File: <white>{file}"
    - "<aqua>Last error: <red>{error}"

# /lc web sub-commands
web:
  no-permission: "<prefix><red>You don't have permission to manage the web panel."
  usage:
    - "<aqua><bold>LunarCore Web Panel</bold>"
    - "<white>/lc web status|url|reload"
    - "<white>/lc web user list|add <name> <password> [role]|remove <name>|passwd <name> <password>|role <name> <role>"
    - "<white>/lc web resetadmin | bind"
  status:
    - "<prefix><aqua>Web panel: {state}"
    - "<aqua>URL: <white><click:open_url:'{url}'><u>{url}</u></click></white> <aqua>Port: <white>{port}"
    - "<aqua>Accounts: <white>{users}</white> <aqua>WebSockets: <white>{ws}</white> <aqua>Routes: <white>{routes}</white> <aqua>Panels: <white>{panels}"
  url: "<prefix><white>Web panel: <aqua><click:open_url:'{url}'><u>{url}</u></click>"
  reload-start: "<prefix><white>Reloading web panel..."
  reload-done: "<prefix><green>Web panel reloaded: <aqua>{url}"
  reload-failed: "<prefix><red>Web panel failed to start, see console."
  not-ready: "<prefix><red>Web account system is not ready."
  error: "<prefix><red>Failed: {message}"
  user-list-header: "<prefix><aqua>Web accounts ({count}):"
  user-list-entry: "<aqua> - <white>{user}</white> [{role}] MC: <white>{mc}"
  user-added: "<prefix><green>Created web account {user} ({role})."
  user-removed: "<prefix><green>Deleted web account {user}."
  user-passwd: "<prefix><green>Password of {user} reset."
  user-role: "<prefix><green>Role of {user} set to {role}."
  console-only: "<prefix><red>Console or OP only."
  resetadmin: "<prefix><yellow>New password for {user}: <aqua><click:copy_to_clipboard:'{password}'>{password}</click>"
  resetadmin-console: "<prefix><yellow>Admin password reset, see console output above."
  player-only: "<prefix><red>Players only."
  bind-code: "<prefix><aqua>Your web code: <white><bold>{code}</bold> <white>(valid {minutes} min)"
